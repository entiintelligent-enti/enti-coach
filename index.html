<!DOCTYPE html>
<html lang="tr">
<head>

<title>Enti Coach</title>

function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function isoDate(d) { const y = d.getFullYear(); const m = String(d.getMonth()+1).padStart(2,"0"); const day = String(d.getDate()).padStart(2,"0"); return `${y}-${m}-${day}`; }
function addDays(dateStr, n) { const d = new Date(dateStr + "T00:00:00"); d.setDate(d.getDate() + n); return isoDate(d); }
function turkishDate(dateStr) { const d = new Date(dateStr + "T00:00:00"); return d.toLocaleDateString("tr-TR", { weekday: "long", day: "numeric", month: "long" }); }
function daysBetween(a, b) { return Math.round((new Date(b+"T00:00:00") - new Date(a+"T00:00:00")) / 86400000); }
function computePhase(profile, dateStr) {
  if (!profile || !profile.programStartDate) return "split";
  const weeks = ADAPTATION_WEEKS[profile.trainingStatus] ?? 0;
  if (weeks <= 0) return "split";
  const elapsedWeeks = Math.floor(daysBetween(profile.programStartDate, dateStr) / 7);
  return elapsedWeeks < weeks ? "adaptation" : "split";
}
function phaseWeeksRemaining(profile, dateStr) {
  const weeks = ADAPTATION_WEEKS[profile.trainingStatus] ?? 0;
  const elapsedWeeks = Math.floor(daysBetween(profile.programStartDate, dateStr) / 7);
  return Math.max(0, weeks - elapsedWeeks);
}
function isEffectiveTrainingDay(dateStr, trainingDays, overrides) {
  if (overrides && overrides[dateStr] !== undefined) return overrides[dateStr];
  const d = new Date(dateStr + "T00:00:00");
  const weekday = d.getDay() === 0 ? 6 : d.getDay() - 1;
  return (trainingDays && trainingDays.length ? trainingDays : DEFAULT_TRAINING_DAYS).includes(weekday);
}
function weekTrainingDays(dateStr, trainingDays, overrides) {
  const d = new Date(dateStr + "T00:00:00");
  const weekday = d.getDay() === 0 ? 6 : d.getDay() - 1;
  const monday = addDays(dateStr, -weekday);
  const days = [];
  for (let i = 0; i < 7; i++) {
    const ds = addDays(monday, i);
    if (isEffectiveTrainingDay(ds, trainingDays, overrides)) days.push(ds);
  }
  return days;
}
function dayTypeForDate(dateStr, trainingDays, phase, overrides) {
  if (!isEffectiveTrainingDay(dateStr, trainingDays, overrides)) return "rest";
  const days = weekTrainingDays(dateStr, trainingDays, overrides);
  const pos = days.indexOf(dateStr);
  const order = phase === "adaptation" ? FULL_BODY_ORDER : SPLIT_ORDER;
  return order[Math.max(0, pos) % order.length];
}

}

// Logs are keyed by NORMALIZED EXERCISE NAME (not id) so that an exercise keeps
// its history whether it came from the static program or from an AI plan,
// whose ids are regenerated every time.
function exKey(name) { return String(name || "").toLocaleLowerCase("tr").replace(/\s+/g, " ").trim(); }
function getSets(entry, name) { return (entry.exerciseLogs || {})[exKey(name)] || []; }
function setVolume(sets) { return sets.reduce((t, s) => t + (Number(s.kg)||0) * (Number(s.reps)||0), 0); }
function formatSets(sets) { return sets.map(s => `${s.kg}kg×${s.reps}`).join(", "); }
function addSet(dateStr, name, kg, reps) {
  const e = getEntry(dateStr);
  const key = exKey(name);
  const logs_ = { ...(e.exerciseLogs || {}) };
  logs_[key] = [...(logs_[key] || []), { kg, reps }];
  updateEntry(dateStr, { exerciseLogs: logs_ });
}
function removeSet(dateStr, name, idx) {
  const e = getEntry(dateStr);
  const key = exKey(name);
  const logs_ = { ...(e.exerciseLogs || {}) };
  const next = (logs_[key] || []).filter((_, i) => i !== idx);
  if (next.length) logs_[key] = next; else delete logs_[key];
  updateEntry(dateStr, { exerciseLogs: logs_ });
}

function findLastPerformance(name, beforeDate) {
  const key = exKey(name);
  const dates = Object.keys(logs).filter(d => d < beforeDate && logs[d] && logs[d].exerciseLogs && logs[d].exerciseLogs[key] && logs[d].exerciseLogs[key].length).sort();
  if (!dates.length) return null;
  const d = dates[dates.length - 1];
  return { date: d, sets: logs[d].exerciseLogs[key] };
}
function calcBMR(p) { const base = 10*p.weightKg + 6.25*p.heightCm - 5*p.age; return p.gender === "kadin" ? base - 161 : base + 5; }
function calcBMI(p) { const h = p.heightCm/100; return p.weightKg/(h*h); }
function computeNutritionTargets(p) {
  const bmr = calcBMR(p);
  const safeBmr = Number.isFinite(bmr) ? bmr : 1800;
  const maint = safeBmr * (ACTIVITY_LEVELS[p.activity]?.mult || 1.45);
  const calorieTarget = Math.round(maint * (GOALS[p.goal]?.mult || 1.0));
  const proteinG = Math.round((p.weightKg||0) * 2.0);
  const fatG = Math.round((calorieTarget * 0.25) / 9);
  const carbG = Math.max(0, Math.round((calorieTarget - proteinG*4 - fatG*9) / 4));
  return { bmr: Math.round(safeBmr), maint: Math.round(maint), calorieTarget, proteinG, fatG, carbG };
}

function getGeminiKey() { try { return localStorage.getItem(GEMINI_KEY_STORAGE) || ""; } catch (e) { return ""; } }
function setGeminiKey(key) { try { localStorage.setItem(GEMINI_KEY_STORAGE, key); } catch (e) {} }

// Model chain: if the primary is overloaded we fall back down the list.
// Flash-Lite is a much less contended endpoint, so it usually answers when the
// main Flash model is saturated.
const GEMINI_MODELS = ["gemini-3.5-flash", "gemini-3.5-flash-lite", "gemini-3.6-flash"];
const RETRYABLE_STATUS = [429, 500, 502, 503, 504];
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
let geminiStatusNote = ""; // shown in the UI while retrying so it doesn't look frozen

async function callGeminiOnce(model, key, systemPrompt, contents, maxTokens) {
  const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
    method: "POST",
    headers: { "Content-Type": "application/json", "x-goog-api-key": key },
    body: JSON.stringify({
      systemInstruction: { parts: [{ text: systemPrompt }] },
      contents,
      generationConfig: { maxOutputTokens: maxTokens || 3000 },
    }),
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) {
    const err = new Error(data?.error?.message || `Gemini isteği başarısız (${response.status})`);
    err.status = response.status;
    err.retryable = RETRYABLE_STATUS.includes(response.status);
    throw err;
  }
  const cand = (data.candidates || [])[0];
  if (!cand) {
    const err = new Error("Gemini boş yanıt döndürdü");
    err.retryable = true;
    throw err;
  }
  // Only use final-answer parts, skip internal "thinking" parts.
  const text = (cand.content?.parts || []).filter(p => !p.thought).map(p => p.text || "").join("").trim();
  if (!text) {
    if (cand.finishReason === "MAX_TOKENS") throw new Error("Gemini yanıtı token limitine takıldı, tekrar dener misin?");
    if (cand.finishReason === "SAFETY") throw new Error("Gemini güvenlik filtresine takıldı");
    const err = new Error("Gemini boş yanıt döndürdü");
    err.retryable = true;
    throw err;
  }
  return text;
}

async function callGemini(systemPrompt, contents, maxTokens) {
  const key = getGeminiKey();
  if (!key) throw new Error("NO_KEY");
  let lastErr = null;
  geminiStatusNote = "";

  for (let m = 0; m < GEMINI_MODELS.length; m++) {
    const model = GEMINI_MODELS[m];
    // 3 attempts per model with exponential backoff (1s, 2s, 4s) + jitter.
    for (let attempt = 0; attempt < 3; attempt++) {
      try {
        const out = await callGeminiOnce(model, key, systemPrompt, contents, maxTokens);
        geminiStatusNote = "";
        return out;
      } catch (e) {
        lastErr = e;
        // A bad key, a blocked prompt or a token-limit hit won't fix itself.
        if (e.retryable === false || e.status === 400 || e.status === 401 || e.status === 403) throw e;
        if (!e.retryable) throw e;
        if (attempt < 2) {
          geminiStatusNote = `Sunucu yoğun, tekrar deneniyor (${attempt + 2}/3)…`;
          render();
          await sleep(1000 * Math.pow(2, attempt) + Math.random() * 400);
        }
      }
    }
    if (m < GEMINI_MODELS.length - 1) {
      geminiStatusNote = `Yedek modele geçiliyor: ${GEMINI_MODELS[m + 1]}…`;
      render();
    }
  }
  geminiStatusNote = "";
  const msg = lastErr?.message || "Bilinmeyen hata";
  throw new Error(`Gemini şu an yoğun, tüm modeller denendi. Birkaç dakika sonra tekrar dene. (${msg})`);
}

  const clean = raw.replace(/```json|```/g, "").trim();

  contents.push({ role: "user", parts: [{ text: newUserText }] });
  return contents;
}

    const e = logs[d];
    const dt = dayTypeForDate(d, trainingDays, computePhase(profile, d), profile.trainingDayOverrides || {});
    const info = effectiveDayInfo(e, dt);
    const totalEx = info.exercises.length;
    const doneEx = e ? info.exercises.filter(ex => e.doneExercises && e.doneExercises[ex.id]).length : 0;
    const trained = (totalEx > 0 && doneEx === totalEx) || !!(e && e.manualComplete);
    const nutrition = e && (e.calories != null || e.protein != null) ? ` (${e.calories ?? "?"} kcal, ${e.protein ?? "?"}g protein)` : "";
    let lifts = "";
    if (e && e.exerciseLogs && Object.keys(e.exerciseLogs).length) {
      lifts = " | kaldırdığı: " + Object.entries(e.exerciseLogs).map(([k, sets]) => `${k} ${formatSets(sets)}`).join("; ");
    }
    lines.push(`${d}: ${trained ? `antrenman yaptı — ${info.label}` : "antrenman yapmadı"}${nutrition}${lifts}`);
  }
  return lines.join("\n");
}
// Last recorded performance for each of today's planned exercises, so the AI can
// prescribe an actual progression instead of guessing.
function buildLastPerformanceLines(entry, dateStr) {
  const info = effectiveDayInfo(entry, entry.dayType);
  const names = [...info.exercises.map(e => e.name), ...(entry.customExercises || []).map(e => e.name)];
  const lines = names.map(n => {
    const last = findLastPerformance(n, dateStr);
    return last ? `${n}: son ${last.date} → ${formatSets(last.sets)}` : `${n}: kayıt yok`;
  });
  return lines.join("\n");
}

// Re-tunes an already-generated plan when the day's nutrition has moved on.
// Exercises the user has ALREADY COMPLETED are never touched — only the
// remaining ones are added to, dropped, or re-scaled.
async function adjustWorkoutForNutrition(currentPlan, doneNames, dayCtx, targets, totals, lastPerfLines) {
  const systemPrompt = `Sen Enti Coach'sun. Kullanıcının BUGÜN İÇİN zaten oluşturulmuş bir antrenman planı var, ama gün içinde beslenmesi değişti. Planı bu yeni duruma göre GÜNCELLE.

KULLANICI: ${profile.gender === "kadin" ? "Kadın" : "Erkek"}, ${profile.age} yaş, ${profile.weightKg}kg, hedefi: ${GOALS[profile.goal]?.label}.
GÜNLÜK HEDEF: ${targets.calorieTarget} kcal, ${targets.proteinG}g protein.
ŞU ANA KADAR ALINAN: ${Math.round(totals.kcal)} kcal, ${Math.round(totals.protein)}g protein, ${Math.round(totals.carbs)}g karbonhidrat.
KALAN BÜTÇE: ${Math.max(0, Math.round(targets.calorieTarget - totals.kcal))} kcal, ${Math.max(0, Math.round(targets.proteinG - totals.protein))}g protein.
PLAN OLUŞTURULDUĞUNDAKİ DURUM: ${Math.round(currentPlan.nutritionSnapshot?.kcal || 0)} kcal, ${Math.round(currentPlan.nutritionSnapshot?.protein || 0)}g protein.

MEVCUT PLAN: ${currentPlan.label}
${currentPlan.exercises.map(ex => `- ${ex.name} | ${ex.scheme}${doneNames.includes(exKey(ex.name)) ? " [TAMAMLANDI]" : ""}`).join("\n")}

BU HAREKETLERİN SON PERFORMANSI:
${lastPerfLines || "Kayıt yok."}

TALİMATLAR:
- [TAMAMLANDI] işaretli hareketleri AYNEN KORU — adını ve şemasını değiştirme, listeden çıkarma.
- Karbonhidrat/kalori beklenenden YÜKSEKSE: hacmi artırabilirsin (1-2 hareket ekle veya set sayısını yükselt).
- Kalori/karbonhidrat DÜŞÜKSE: hacmi kıs (kalan hareketlerden 1-2'sini çıkar, ağır bileşik hareketleri hafiflet), yaralanma riskini artırma.
- Protein düşükse hacmi zorlamadan koru, "sub" alanında protein uyarısı ver.
- Değişiklik gerekmiyorsa planı aynen döndür.
- "sub" alanına neyi neden değiştirdiğini 1 cümleyle Türkçe yaz.
- Mümkün olduğunca şu katalogdan seç ve id döndür; katalogda yoksa id null olsun.
HAREKET KATALOĞU (id: isim): ${EXERCISE_CATALOG_TEXT}
- SADECE şu JSON ile yanıt ver, markdown fence ekleme:
{"label": "kısa başlık", "sub": "1 cümlelik gerekçe", "cardio": "kardiyo notu veya null", "exercises": [{"id": "katalog id veya null", "name": "Hareket adı", "scheme": "3 × 10-12", "tip": "1 cümlelik form ipucu"}]}`;

  const raw = await callGemini(systemPrompt, [{ role: "user", parts: [{ text: "Planı güncel beslenmeme göre güncelle." }] }], 4000);
  const parsed = JSON.parse(extractJson(raw));
  const byName = {};
  currentPlan.exercises.forEach(ex => { byName[exKey(ex.name)] = ex; });
  const exercises = (parsed.exercises || []).map((ex, i) => {
    const existing = byName[exKey(ex.name)];
    // Reuse the existing id so that completed checkmarks and set logs survive.
    if (existing) return { ...existing, scheme: doneNames.includes(exKey(ex.name)) ? existing.scheme : (ex.scheme || existing.scheme), tip: ex.tip || existing.tip };
    return { id: ex.id && MEDIA[ex.id] ? ex.id : `ai-${Date.now()}-${i}`, name: ex.name, scheme: ex.scheme, tip: ex.tip };
  });
  // Safety net: never lose a completed exercise even if the model dropped it.
  currentPlan.exercises.forEach(ex => {
    if (doneNames.includes(exKey(ex.name)) && !exercises.some(n => exKey(n.name) === exKey(ex.name))) exercises.unshift(ex);
  });
  return { label: parsed.label, sub: parsed.sub, cardio: parsed.cardio || null, exercises };
}

GÜNLÜK HEDEF: ${targets.calorieTarget} kcal, ${targets.proteinG}g protein, ${targets.carbG}g karbonhidrat, ${targets.fatG}g yağ.
ANTRENMAN PROGRAMI: ${dayCtx.phase === "adaptation" ? "adaptasyon fazında — full body + kardiyo, hafif ağırlık (sonra split'e geçecek)" : "haftada 4 gün Upper/Lower split"}.
BUGÜN (${dayCtx.dateLabel}): antrenman günü ${dayCtx.dayLabel}${dayCtx.totalEx > 0 ? ` (${dayCtx.doneEx}/${dayCtx.totalEx} tamamlandı)` : ""}. Bugüne kadar: ${loggedLine}. Bu hafta tamamlanan antrenman: ${dayCtx.weekDone}/${dayCtx.weekPlanned}.
SON ANTRENMAN KAYITLARI (beslenme + kaldırılan ağırlıklar):

Ağırlık sorulursa bu kayıtlara dayanarak somut sayı ver, tahmin etme.

Cevaplarını profiline, hedefine ve bugünkü duruma göre şekillendir, genel tavsiye verme. Kısa ve uygulanabilir yaz. Tıbbi teşhis koyma.`;
  return callGemini(systemPrompt, toGeminiContents(history, userMessage));
}

try { const raw = localStorage.getItem(LOGS_KEY); logs = raw ? JSON.parse(raw) : {}; } catch (e) { logs = {}; }
try { const raw = localStorage.getItem(PROFILE_KEY); profile = raw ? JSON.parse(raw) : null; } catch (e) { profile = null; }

function persistLogs() { try { localStorage.setItem(LOGS_KEY, JSON.stringify(logs)); } catch (e) { console.error(e); } }
function persistProfile() { try { localStorage.setItem(PROFILE_KEY, JSON.stringify(profile)); } catch (e) { console.error(e); } }
function setDayOverride(dateStr, value) {
  const overrides = { ...(profile.trainingDayOverrides || {}) };
  if (value === null) delete overrides[dateStr];
  else overrides[dateStr] = value;
  profile = { ...profile, trainingDayOverrides: overrides };
  persistProfile();
}

function getEntry(dateStr) {
  const td = profile?.trainingDays || DEFAULT_TRAINING_DAYS;
  const ov = profile?.trainingDayOverrides || {};
  const phase = computePhase(profile, dateStr);
  const dayType = dayTypeForDate(dateStr, td, phase, ov);
  const stored = logs[dateStr];
  const base = stored || emptyEntry(dateStr, td, phase, ov);
  return { ...base, dayType };
}
function updateEntry(dateStr, patch) {
  const current = getEntry(dateStr);
  logs[dateStr] = { ...current, ...patch };
  persistLogs();
}
function toggleDayTrained(dateStr) {
  const current = getEntry(dateStr);
  logs[dateStr] = { ...current, manualComplete: !current.manualComplete };
  persistLogs();
}

// Weekly streak: how many planned sessions have actually been completed in the
// CURRENT week (Mon-Sun). Rest days never count and never break it, and the
// counter resets on its own every Monday.
function didTrainOn(dateStr) {
  const e = logs[dateStr];
  if (!e) return false;
  if (e.manualComplete) return true;
  const td = profile?.trainingDays || DEFAULT_TRAINING_DAYS;
  const ov = profile?.trainingDayOverrides || {};
  const dt = dayTypeForDate(dateStr, td, computePhase(profile, dateStr), ov);
  const info = effectiveDayInfo(e, dt);
  const total = info.exercises.length;
  if (total === 0) return false;
  return info.exercises.filter(ex => e.doneExercises && e.doneExercises[ex.id]).length === total;
}
function weekStats(dateStr) {
  const td = profile?.trainingDays || DEFAULT_TRAINING_DAYS;
  const ov = profile?.trainingDayOverrides || {};
  const d = new Date(dateStr + "T00:00:00");
  const weekday = d.getDay() === 0 ? 6 : d.getDay() - 1; // Mon = 0
  const monday = addDays(dateStr, -weekday);
  let done = 0, planned = 0;
  for (let i = 0; i < 7; i++) {
    const ds = addDays(monday, i);
    if (isEffectiveTrainingDay(ds, td, ov)) planned++;
    if (didTrainOn(ds)) done++;
  }
  return { done, planned, monday };
}
function computeStreak() { return weekStats(today).done; }
function todayContext() {
  const td = profile?.trainingDays || DEFAULT_TRAINING_DAYS;
  const ov = profile?.trainingDayOverrides || {};
  const phase = computePhase(profile, today);
  const dt = dayTypeForDate(today, td, phase, ov);
  const e = getEntry(today);
  const info = effectiveDayInfo(e, dt);
  const doneEx = info.exercises.filter(ex => e.doneExercises[ex.id]).length;
  return { dateLabel: turkishDate(today), dayLabel: info.label, phase, totalEx: info.exercises.length, doneEx, calories: e.calories, protein: e.protein, water: e.water, sleep: e.sleep, weekDone: weekStats(today).done, weekPlanned: weekStats(today).planned };
}

        <button class="tab-btn ${activeTab==='nutrition'?'active':''}" data-tab="nutrition">🍽️<span class="tab-label">Beslenme</span></button>

function renderCoachWidget() {

  if (!widget) {
    widget = document.createElement("div");

    document.body.appendChild(widget);
  }

  const dayCtx = todayContext();

  widget.innerHTML = `
    <button class="coach-fab" id="coachFabBtn" style="${coachOpen ? 'display:none;' : ''}">

      <div class="coach-panel-head">

          <div class="coach-panel-sub">Beslenme, antrenman, ilerleme — ne sorarsan sor.</div>
        </div>
        <button class="coach-close-btn" id="coachCloseBtn">✕</button>
      </div>

      ${!key ? `
        <div class="gemini-setup">
          AI özelliklerini kullanmak için ücretsiz bir Gemini API key gerekiyor.
          <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a> adresinden alabilirsin (kredi kartı istemiyor).
          <div class="gemini-key-row">
            <input class="gemini-key-input" id="geminiKeyInput" placeholder="API key'ini yapıştır" />
            <button class="gemini-key-save" id="geminiKeySave">Kaydet</button>
          </div>
        </div>
      ` : `
        <div class="chat-scroll" id="chatScroll">
          ${coachMessages.map(m => `<div class="chat-bubble ${m.role}">${esc(m.content)}</div>`).join("")}
          ${coachLoading ? `<div class="chat-bubble assistant">düşünüyor…</div>` : ""}
        </div>
        ${coachError ? `<div class="chat-error">${esc(coachError)}</div>` : ""}
        <div class="chat-input-row">
          <input type="text" class="chat-input" id="chatInput" placeholder="örn. bugün ne yesem?" />
          <button class="chat-send-btn" id="chatSend">➤</button>
        </div>
        <button class="gemini-key-link" id="changeKeyBtn">API key'i değiştir</button>
      `}
    </div>
  `;

  document.getElementById("coachFabBtn").addEventListener("click", () => { coachOpen = true; renderCoachWidget(); });
  document.getElementById("coachCloseBtn").addEventListener("click", () => { coachOpen = false; renderCoachWidget(); });

  if (!key) {
    document.getElementById("geminiKeySave").addEventListener("click", () => {
      const val = document.getElementById("geminiKeyInput").value.trim();
      if (!val) return;
      setGeminiKey(val);
      renderCoachWidget();
    });
  } else {
    const scroll = document.getElementById("chatScroll");
    if (scroll) scroll.scrollTop = scroll.scrollHeight;
    document.getElementById("changeKeyBtn").addEventListener("click", () => {
      setGeminiKey("");
      renderCoachWidget();
    });
    const send = async () => {
      const input = document.getElementById("chatInput");
      const text = input.value.trim();
      if (!text || coachLoading) return;
      input.value = "";
      coachError = "";
      coachMessages = [...coachMessages, { role: "user", content: text }];
      coachLoading = true;
      renderCoachWidget();
      try {
        const priorHistory = coachMessages.slice(0, -1);
        const reply = await askCoach(text, profile, targets, priorHistory, dayCtx);
        coachMessages = [...coachMessages, { role: "assistant", content: reply }];
      } catch (e) {
        coachError = e.message === "NO_KEY" ? "API key bulunamadı." : (e.message || "Bir şeyler ters gitti, tekrar dener misin?");
      } finally {
        coachLoading = false;
        renderCoachWidget();
      }
    };
    document.getElementById("chatSend").addEventListener("click", send);
    document.getElementById("chatInput").addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
  }
}

let calViewMonth = today.slice(0, 7);
function monthMeta(ym) {
  const [y, m] = ym.split("-").map(Number);
  const first = new Date(y, m - 1, 1);
  const daysInMonth = new Date(y, m, 0).getDate();
  const firstWeekday = first.getDay() === 0 ? 6 : first.getDay() - 1;
  const label = first.toLocaleDateString("tr-TR", { month: "long", year: "numeric" });
  return { y, m, daysInMonth, firstWeekday, label };
}
function shiftMonth(ym, delta) {
  const [y, m] = ym.split("-").map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
}
function cellDateStr(ym, day) { return `${ym}-${String(day).padStart(2, "0")}`; }

function renderCalendarHtml() {
  const meta = monthMeta(calViewMonth);
  const trainingDays = profile.trainingDays || DEFAULT_TRAINING_DAYS;
  const overrides = profile.trainingDayOverrides || {};
  const blanks = Array.from({ length: meta.firstWeekday }).map(() => `<div></div>`).join("");
  const cells = Array.from({ length: meta.daysInMonth }, (_, i) => i + 1).map(day => {

    let bg = "transparent", border = "none", textColor = "#6B7280";

          <span class="cal-day-num ${isToday?'today':''}" style="color:${textColor}">${day}</span>

  return `

}

// --- Apple-Watch style progress rings ---------------------------------------
const WATER_TARGET_ML = 3000;
const SLEEP_TARGET_H = 8;
const METRIC_COLORS = {
  calories: "#FF2D6F",  // pink
  protein:  "#A8F000",  // lime
  water:    "#00B8D9",  // cyan-blue
  sleep:    "#7C5CE0",  // violet
  workout:  "#FF8A1E",  // orange — kept well away from water/sleep
};

function ringArc(pct, r) {
  const circ = 2 * Math.PI * r;
  const filled = (Math.min(100, Math.max(0, pct)) / 100) * circ;
  return { circ, dash: `${filled} ${circ - filled}` };
}
function miniRingSvg(pct, color) {
  const r = 17, sw = 5, size = 44;
  const { dash } = ringArc(pct, r);
  return `
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle class="ring-bg" cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-width="${sw}"></circle>
      <circle class="ring-fg" cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-width="${sw}" stroke-dasharray="${dash}"></circle>
      <text x="${size/2}" y="${size/2}" text-anchor="middle" dominant-baseline="central" class="metric-ring-pct" fill="${color}">${pct}%</text>
    </svg>`;
}
// Generic concentric-ring card. `rows` need key/label/value/target/unit and may
// carry a `note` that replaces the "x / y unit" line (e.g. on rest days).
function ringsCardHtml(eyebrow, rows) {
  const withPct = rows.map(r => ({
    ...r,
    pct: r.target ? Math.min(999, Math.round((r.value / r.target) * 100)) : (r.fullWhenNoTarget ? 100 : 0),
  }));
  const size = 168, sw = 15;
  const radii = [68, 49, 30];
  const circles = withPct.map((r, i) => {
    const { dash } = ringArc(r.pct, radii[i]);
    const c = METRIC_COLORS[r.key];
    return `
      <circle class="ring-bg" cx="${size/2}" cy="${size/2}" r="${radii[i]}" stroke="${c}" stroke-width="${sw}"></circle>
      <circle class="ring-fg" cx="${size/2}" cy="${size/2}" r="${radii[i]}" stroke="${c}" stroke-width="${sw}" stroke-dasharray="${dash}"></circle>`;
  }).join("");

  return `
    <section class="card">
      <div class="card-eyebrow">${eyebrow}</div>
      <div class="rings-card" style="margin-top:14px;">
        <svg class="rings-svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${circles}</svg>
        <div class="rings-legend">
          ${withPct.map(r => `
            <div class="ring-legend-item">
              <span class="ring-legend-dot" style="background:${METRIC_COLORS[r.key]}"></span>
              <span class="ring-legend-text">
                <span class="ring-legend-label">${r.label}</span><br/>
                <span class="ring-legend-value">${r.note ? r.note : `${r.value} / ${r.target} ${r.unit}`}</span>
              </span>
              <span class="ring-legend-pct" style="color:${METRIC_COLORS[r.key]}">${r.pct}%</span>
            </div>`).join("")}
        </div>
      </div>
    </section>`;
}

// Home: water, sleep, workout completion.
function homeRingsHtml(entry) {
  const info = effectiveDayInfo(entry, entry.dayType);
  const allEx = [...info.exercises, ...(entry.customExercises || [])];
  const doneCount = allEx.filter(ex => entry.doneExercises[ex.id]).length;
  const isRest = entry.dayType === "rest";
  return ringsCardHtml(activeDate === today ? "BUGÜN NELER YAPTIM" : "O GÜN NELER YAPTIM", [
    { key: "water", label: "Su",    value: entry.water ?? 0, target: WATER_TARGET_ML, unit: "ml" },
    { key: "sleep", label: "Uyku",  value: entry.sleep ?? 0, target: SLEEP_TARGET_H,  unit: "saat" },
    { key: "workout", label: "Antrenman", value: doneCount, target: allEx.length, unit: "hareket",
      note: isRest ? "dinlenme günü" : null, fullWhenNoTarget: isRest },
  ]);
}

function addMeal(entry, newMeal) {
  const nextMeals = [...(entry.meals || []), newMeal];
  const t = sumMeals(nextMeals);
  updateEntry(activeDate, { meals: nextMeals, calories: t.kcal, protein: t.protein, carbs: t.carbs, fat: t.fat });
  maybeAdjustPlanForNutrition();
}

function attachNutritionHandlers(entry, targets) {
  document.querySelectorAll("[data-remove-meal]").forEach(btn => {
    btn.addEventListener("click", () => {
      const nextMeals = (entry.meals || []).filter(m => m.id !== btn.dataset.removeMeal);
      const t = sumMeals(nextMeals);
      updateEntry(activeDate, { meals: nextMeals, calories: t.kcal, protein: t.protein, carbs: t.carbs, fat: t.fat });
      render();
      maybeAdjustPlanForNutrition();
    });
  });

  document.getElementById("manualAdd").addEventListener("click", () => {
    const kcal = Number(document.getElementById("manualKcal").value) || 0;
    const protein = Number(document.getElementById("manualProtein").value) || 0;
    if (!kcal && !protein) return;
    addMeal(entry, { id: `${Date.now()}`, text: "Elle eklendi", kcal, protein, carbs: 0, fat: 0 });
    lastMealResult = null;
    render();
  });

  const submitMeal = async () => {
    const input = document.getElementById("mealInput");
    const description = input.value.trim();
    if (!description || mealLoading) return;
    if (!getGeminiKey()) { mealError = "API key bulunamadı."; render(); return; }
    mealLoading = true; mealError = ""; lastMealResult = null;
    render();
    try {
      const priorTotals = sumMeals(entry.meals);
      const result = await analyzeMealAndAdvise(description, profile, targets, todayContext(), priorTotals);
      addMeal(entry, { id: `${Date.now()}`, text: description, breakdown: result.breakdown, kcal: result.kcal, protein: result.protein, carbs: result.carbs, fat: result.fat });
      lastMealResult = { ...result, description };
    } catch (e) {
      mealError = e.message || "Bilinmeyen hata";
    } finally {
      mealLoading = false;
      render();
    }
  };
  document.getElementById("mealSend").addEventListener("click", submitMeal);
  document.getElementById("mealInput").addEventListener("keydown", (e) => { if (e.key === "Enter") submitMeal(); });

  document.querySelectorAll("[data-open-recipe]").forEach(row => {
    row.addEventListener("click", () => openRecipeModal(row.dataset.openRecipe));
  });

  const customRecipeInput = document.getElementById("customRecipeInput");
  customRecipeInput.addEventListener("input", () => { customRecipeInputText = customRecipeInput.value; });
  const submitCustomRecipe = async () => {
    const dishName = customRecipeInput.value.trim();
    if (!dishName || customRecipeLoading) return;
    if (!getGeminiKey()) { customRecipeError = "API key bulunamadı."; render(); return; }
    customRecipeLoading = true; customRecipeError = "";
    render();
    try {
      const priorTotals = sumMeals(entry.meals);
      const data = await generateCustomRecipe(dishName, profile, targets, priorTotals);
      customRecipeLoading = false;
      customRecipeInputText = "";
      render();
      openCustomRecipeModal(data);
    } catch (e) {
      customRecipeLoading = false;
      customRecipeError = e.message || "Bilinmeyen hata";
      render();
    }
  };
  document.getElementById("customRecipeSend").addEventListener("click", submitCustomRecipe);
  customRecipeInput.addEventListener("keydown", (e) => { if (e.key === "Enter") submitCustomRecipe(); });
}

let planAdjustLoading = false;
let planAdjustNote = "";           // short "what changed" message shown once
const NUTRITION_DRIFT_KCAL = 250;  // re-tune only after a meaningful change
const NUTRITION_DRIFT_PROTEIN = 20;

// ---------------------------------------------------------------------------
// Automatic AI planning
// Fires once when a new training day opens, then re-tunes the plan as meals
// are logged. Falls back silently to the static program if it can't run.
// ---------------------------------------------------------------------------
function autoPlanEnabled() { return profile && profile.autoAiPlan !== false; }

function buildPlanDayCtx(entry, dateStr) {
  return {
    dateLabel: turkishDate(dateStr),
    phase: computePhase(profile, dateStr),
    calories: entry.calories,
    protein: entry.protein,
  };
}

async function maybeAutoGeneratePlan() {
  if (!autoPlanEnabled() || autoGenLoading) return;
  if (activeDate !== today) return;                 // only auto-plan the live day
  if (autoGenAttemptedDate === today) return;       // one attempt per day
  const entry = getEntry(today);
  if (entry.aiWorkout && entry.aiWorkout.exercises && entry.aiWorkout.exercises.length) return;
  if (entry.dayType === "rest") return;             // nothing to plan on rest days
  if (!getGeminiKey()) return;                      // no key → keep static program

  autoGenAttemptedDate = today;
  autoGenLoading = true;
  autoGenError = "";
  render();
  try {
    const trainingDays = profile.trainingDays || DEFAULT_TRAINING_DAYS;
    const targets = computeNutritionTargets(profile);
    const totals = sumMeals(entry.meals);
    const aiWorkout = await generateTodayWorkout(
      buildPlanDayCtx(entry, today),
      buildTrainingHistoryLines(trainingDays, today, 7),
      buildLastPerformanceLines(entry, today)
    );
    aiWorkout.nutritionSnapshot = { kcal: totals.kcal, protein: totals.protein };
    aiWorkout.autoGenerated = true;
    updateEntry(today, { aiWorkout, doneExercises: {}, customExercises: [] });
  } catch (e) {
    autoGenError = e.message || "Bilinmeyen hata";
  } finally {
    autoGenLoading = false;
    render();
  }
}

// Called after a meal is logged. Only re-tunes once intake has actually moved.
async function maybeAdjustPlanForNutrition() {
  if (!autoPlanEnabled() || planAdjustLoading || autoGenLoading) return;
  if (activeDate !== today) return;
  const entry = getEntry(today);
  const plan = entry.aiWorkout;
  if (!plan || !plan.exercises || !plan.exercises.length) return;
  if (!getGeminiKey()) return;

  const targets = computeNutritionTargets(profile);
  const totals = sumMeals(entry.meals);
  const snap = plan.nutritionSnapshot || { kcal: 0, protein: 0 };
  const driftKcal = Math.abs(totals.kcal - snap.kcal);
  const driftProtein = Math.abs(totals.protein - snap.protein);
  if (driftKcal < NUTRITION_DRIFT_KCAL && driftProtein < NUTRITION_DRIFT_PROTEIN) return;

  planAdjustLoading = true;
  planAdjustNote = "";
  render();
  try {
    const doneNames = plan.exercises.filter(ex => entry.doneExercises[ex.id]).map(ex => exKey(ex.name));
    const updated = await adjustWorkoutForNutrition(
      plan, doneNames,
      buildPlanDayCtx(entry, today), targets, totals,
      buildLastPerformanceLines(entry, today)
    );
    updated.nutritionSnapshot = { kcal: totals.kcal, protein: totals.protein };
    updated.autoGenerated = true;
    // Keep the checkmarks of anything that survived the update.
    const keptIds = new Set(updated.exercises.map(ex => ex.id));
    const doneExercises = {};
    Object.keys(entry.doneExercises || {}).forEach(id => { if (keptIds.has(id)) doneExercises[id] = entry.doneExercises[id]; });
    updateEntry(today, { aiWorkout: updated, doneExercises });
    planAdjustNote = updated.sub || "Plan beslenmene göre güncellendi.";
  } catch (e) {
    planAdjustNote = "";
  } finally {
    planAdjustLoading = false;
    render();
  }
}

function logBtnHtml(entry, name) {
  const sets = getSets(entry, name);
  return `<button class="log-btn ${sets.length ? "has-sets" : ""}" data-log="${esc(name)}">${sets.length ? `${sets.length}✓` : "kg"}</button>`;
}
function logPanelHtml(entry, name) {
  if (openLogKey !== exKey(name)) return "";
  const sets = getSets(entry, name);
  const last = findLastPerformance(name, activeDate);
  const vol = setVolume(sets);
  return `
    <div class="log-panel">
      ${last ? `<div class="log-last">geçen sefer (${last.date}): ${esc(formatSets(last.sets))}</div>` : ""}
      ${sets.length
        ? sets.map((s, i) => `<div class="log-set-row"><span class="log-set-idx">${i+1}.</span><span class="log-set-val">${s.kg} kg × ${s.reps} tekrar</span><button class="log-set-del" data-del-set="${esc(name)}" data-idx="${i}">✕</button></div>`).join("")
        : `<div class="log-empty">Henüz set girilmedi.</div>`}
      ${sets.length ? `<div class="log-volume">toplam hacim: ${Math.round(vol)} kg</div>` : ""}
      <div class="log-input-row">
        <input class="log-input" type="number" inputmode="decimal" step="0.5" placeholder="kg" data-kg="${esc(name)}" />
        <input class="log-input" type="number" inputmode="numeric" placeholder="tekrar" data-reps="${esc(name)}" />
        <button class="log-add-btn" data-add-set="${esc(name)}">+</button>
      </div>
    </div>`;
}

function renderTraining(entry, phase, weeksRemaining) {
  const dayInfo = effectiveDayInfo(entry, entry.dayType);
  const totalEx = dayInfo.exercises.length;
  const doneEx = dayInfo.exercises.filter(e => entry.doneExercises[e.id]).length;
  const customExercises = entry.customExercises || [];

  let exListHtml = "";
  if (totalEx === 0) {
    exListHtml = `<div class="rest-note">Bugün planda dinlenme var. Yine de antrenman yaptıysan Ana Sayfa'daki takvimden bu güne dokunarak işaretleyebilirsin.</div>`;
  } else {
    const markAllBtn = `<button class="mark-all-btn" id="markAllBtn" data-set="${doneEx < totalEx}">${doneEx < totalEx ? "Tümünü tamamlandı işaretle" : "Tümünü kaldır"}</button>`;
    exListHtml = markAllBtn + `<div class="ex-list">` + dayInfo.exercises.map(ex => {
      const done = !!entry.doneExercises[ex.id];
      return `
        <div class="ex-block">
        <div class="ex-row ${done?'done':''}">
          <button class="checkbox-btn" data-toggle="${ex.id}"><span class="checkbox ${done?'done':''}">${done?'✓':''}</span></button>
          <button class="ex-name-btn" data-toggle="${ex.id}"><span class="ex-name ${done?'done':''}">${esc(ex.name)}</span></button>
          <span class="ex-scheme">${ex.scheme}</span>
          ${logBtnHtml(entry, ex.name)}
          <button class="info-btn" data-info="${ex.id}" data-name="${esc(ex.name)}" data-scheme="${ex.scheme}" data-tip="${esc(ex.tip || "")}">i</button>
        </div>
        ${logPanelHtml(entry, ex.name)}
        </div>`;
    }).join("") + customExercises.map(ex => {
      const done = !!entry.doneExercises[ex.id];
      return `
        <div class="ex-block">
        <div class="ex-row ex-row-custom ${done?'done':''}">
          <button class="checkbox-btn" data-toggle="${ex.id}"><span class="checkbox ${done?'done':''}">${done?'✓':''}</span></button>
          <button class="ex-name-btn" data-toggle="${ex.id}">
            <span class="ex-name ${done?'done':''}">${esc(ex.name)}</span>
            ${ex.tip ? `<div class="ex-custom-tip">${esc(ex.tip)}</div>` : ""}
          </button>
          <span class="ex-scheme">${ex.scheme}</span>
          ${logBtnHtml(entry, ex.name)}
          <button class="info-btn" data-remove-custom="${ex.id}">✕</button>
        </div>
        ${logPanelHtml(entry, ex.name)}
        </div>`;
    }).join("") + `</div>`;
  }

  const phaseBanner = phase === "adaptation" ? `
    <div class="phase-banner">
      <span class="phase-banner-title">Adaptasyon Fazı</span>
      <span class="phase-banner-sub">${weeksRemaining > 0 ? `${weeksRemaining} hafta sonra Upper/Lower split'e geçeceksin` : "Split'e geçiş bu hafta"} — full body + kardiyo, hafif ağırlık, form odaklı.</span>
    </div>` : "";

  return `
    ${autoGenLoading ? `<div class="auto-plan-banner">✨ ${geminiStatusNote || "Bugünün planı hazırlanıyor…"}</div>` : ""}
    ${planAdjustLoading ? `<div class="auto-plan-banner">🍽️ Plan beslenmene göre güncelleniyor…</div>` : ""}
    ${planAdjustNote && !planAdjustLoading ? `<div class="auto-plan-note">🍽️ ${esc(planAdjustNote)}<button class="auto-plan-dismiss" id="planNoteDismiss">✕</button></div>` : ""}
    ${autoGenError ? `<div class="chat-error">Otomatik plan kurulamadı: ${esc(autoGenError)} — standart program gösteriliyor.</div>` : ""}
    <button class="ai-gen-btn" id="aiGenBtn" ${aiGenLoading || autoGenLoading ? "disabled" : ""}>
      ✨ ${aiGenLoading ? (geminiStatusNote || "planlanıyor…") : dayInfo.isAI ? "Yeniden Planla" : "Yeni Antrenman Planla"}
    </button>
    ${aiGenError ? `<div class="chat-error">Plan oluşturulamadı: ${esc(aiGenError)}</div>` : ""}
    ${dayInfo.isAI ? `<button class="ai-revert-btn" id="aiRevertBtn">Standart programa dön</button>` : ""}
    <label class="auto-plan-toggle">
      <input type="checkbox" id="autoPlanToggle" ${autoPlanEnabled() ? "checked" : ""} />
      <span>Her gün planı otomatik kur, öğünlerime göre güncelle</span>
    </label>
    ${phaseBanner}
    <section class="card">
      <div class="card-head-row">
        <div><div class="card-eyebrow">${String(totalEx + customExercises.length).padStart(2,"0")} HAREKET${dayInfo.isAI ? ` <span class="ai-badge">· AI PLANI</span>` : ""}</div><div class="card-title">${dayInfo.label}</div><div class="card-sub">${dayInfo.sub}</div></div>
      </div>
      ${totalEx > 0 ? `<div class="progress-track"><div class="progress-fill" style="width:${(doneEx/totalEx)*100}%"></div></div>` : ""}
      ${dayInfo.cardio ? `<div class="cardio-note">🏃 ${dayInfo.cardio}</div>` : ""}
      ${exListHtml}
    </section>
    <div class="version-tag">Enti Coach v${APP_VERSION}</div>
  `;
}

function attachTrainingHandlers(entry) {
  const aiGenBtn = document.getElementById("aiGenBtn");
  if (aiGenBtn) aiGenBtn.addEventListener("click", async () => {
    if (!getGeminiKey()) { aiGenError = "API key bulunamadı."; render(); return; }
    aiGenLoading = true; aiGenError = "";
    render();
    try {
      const trainingDays = profile.trainingDays || DEFAULT_TRAINING_DAYS;
      const dayCtx = {
        dateLabel: turkishDate(activeDate),
        phase: computePhase(profile, activeDate),
        calories: entry.calories,
        protein: entry.protein,
      };
      const historyLines = buildTrainingHistoryLines(trainingDays, activeDate, 7);
      const lastPerfLines = buildLastPerformanceLines(entry, activeDate);
      const aiWorkout = await generateTodayWorkout(dayCtx, historyLines, lastPerfLines);
      const totalsNow = sumMeals(entry.meals);
      aiWorkout.nutritionSnapshot = { kcal: totalsNow.kcal, protein: totalsNow.protein };
      updateEntry(activeDate, { aiWorkout, doneExercises: {}, customExercises: [] });
    } catch (e) {
      aiGenError = e.message || "Bilinmeyen hata";
    } finally {
      aiGenLoading = false;
      render();
    }
  });
  const aiRevertBtn = document.getElementById("aiRevertBtn");
  if (aiRevertBtn) aiRevertBtn.addEventListener("click", () => {
    updateEntry(activeDate, { aiWorkout: null });
    if (activeDate === today) autoGenAttemptedDate = today; // don't instantly re-plan
    render();
  });
  const autoPlanToggle = document.getElementById("autoPlanToggle");
  if (autoPlanToggle) autoPlanToggle.addEventListener("change", () => {
    profile = { ...profile, autoAiPlan: autoPlanToggle.checked };
    persistProfile();
    if (autoPlanToggle.checked) autoGenAttemptedDate = null; // allow an immediate attempt
    render();
  });
  const planNoteDismiss = document.getElementById("planNoteDismiss");
  if (planNoteDismiss) planNoteDismiss.addEventListener("click", () => { planAdjustNote = ""; render(); });
  const markAllBtn = document.getElementById("markAllBtn");
  if (markAllBtn) markAllBtn.addEventListener("click", () => {
    const dayInfo = effectiveDayInfo(entry, entry.dayType);
    const allIds = [...dayInfo.exercises.map(e => e.id), ...(entry.customExercises||[]).map(e => e.id)];
    const setTo = markAllBtn.dataset.set === "true";
    const doneExercises = { ...entry.doneExercises };
    allIds.forEach(id => { doneExercises[id] = setTo; });
    updateEntry(activeDate, { doneExercises });
    render();
  });
  document.querySelectorAll("[data-toggle]").forEach(el => {
    el.addEventListener("click", () => {
      const doneExercises = { ...entry.doneExercises, [el.dataset.toggle]: !entry.doneExercises[el.dataset.toggle] };
      updateEntry(activeDate, { doneExercises });
      render();
    });
  });
  document.querySelectorAll("[data-info]").forEach(el => {
    el.addEventListener("click", () => openModal(el.dataset.info, el.dataset.name, el.dataset.scheme, el.dataset.tip));
  });
  document.querySelectorAll("[data-remove-custom]").forEach(el => {
    el.addEventListener("click", () => {
      const id = el.dataset.removeCustom;
      const nextCustom = (entry.customExercises || []).filter(c => c.id !== id);
      const doneExercises = { ...entry.doneExercises };
      delete doneExercises[id];
      updateEntry(activeDate, { customExercises: nextCustom, doneExercises });
      render();
    });
  });

  // --- set logging ---
  document.querySelectorAll("[data-log]").forEach(el => {
    el.addEventListener("click", () => {
      const key = exKey(el.dataset.log);
      openLogKey = openLogKey === key ? null : key;
      render();
    });
  });
  document.querySelectorAll("[data-add-set]").forEach(el => {
    const name = el.dataset.addSet;
    const panel = el.closest(".log-panel");
    const submit = () => {
      const kgEl = panel.querySelector("[data-kg]");
      const repsEl = panel.querySelector("[data-reps]");
      const kg = Number(kgEl.value);
      const reps = Number(repsEl.value);
      if (!Number.isFinite(kg) || !Number.isFinite(reps) || reps <= 0) return;
      addSet(activeDate, name, kg, reps);
      render();
    };
    el.addEventListener("click", submit);
    const repsEl = panel.querySelector("[data-reps]");
    if (repsEl) repsEl.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
  });
  document.querySelectorAll("[data-del-set]").forEach(el => {
    el.addEventListener("click", () => {
      removeSet(activeDate, el.dataset.delSet, Number(el.dataset.idx));
      render();
    });
  });
}

function openModal(exId, name, scheme, tipArg) {
  const media = MEDIA[exId];
  const tip = (media && media.tip) || tipArg || "";
  const imgHtml = media ? `
    <div class="modal-img-row">
      <img class="modal-img" src="${exImg(exId,0)}" alt="${esc(name)}" onerror="this.style.display='none'" />
      <img class="modal-img" src="${exImg(exId,1)}" alt="${esc(name)}" onerror="this.style.display='none'" />
    </div>` : "";
  document.getElementById("modalCard").innerHTML = `
    <div class="modal-head">
      <div><div class="card-eyebrow">HAREKET</div><div class="modal-title">${esc(name)}</div></div>
      <button class="modal-close" id="modalCloseBtn">✕</button>
    </div>
    ${imgHtml}
    ${tip ? `<div class="modal-tip">${esc(tip)}</div>` : ""}
    <div class="modal-scheme">${scheme}</div>
  `;
  document.getElementById("modalBackdrop").classList.add("open");
  document.getElementById("modalCloseBtn").addEventListener("click", closeModal);
}
function closeModal() { document.getElementById("modalBackdrop").classList.remove("open"); }
document.getElementById("modalBackdrop").addEventListener("click", (e) => { if (e.target.id === "modalBackdrop") closeModal(); });

// ---------------------------------------------------------------------------
// Recipe modal — swipeable step-by-step preparation view (like the sporcu
// kahvaltısı example), with a servings stepper that scales grams and a
// per-step timer.
// ---------------------------------------------------------------------------
function fmtAmount(n) { return Number.isInteger(n) ? n : Math.round(n * 10) / 10; }
function getActiveRecipe() { return recipeId === "__custom__" ? customRecipeData : RECIPES[recipeId]; }
function stopRecipeTimer() {
  if (recipeTimerHandle) { clearInterval(recipeTimerHandle); recipeTimerHandle = null; }
  recipeTimerRunning = false;
}
function openRecipeModal(id) {
  const r = RECIPES[id];
  if (!r) return;
  recipeId = id;
  recipeStepIdx = 0;
  recipeServings = r.baseServings || 1;
  recipeShowIngredients = true;
  stopRecipeTimer();
  recipeTimerLeft = r.steps[0]?.timer ?? null;
  renderRecipeModal();
  document.getElementById("recipeModalBackdrop").classList.add("open");
}
function openCustomRecipeModal(data) {
  customRecipeData = data;
  recipeId = "__custom__";
  recipeStepIdx = 0;
  recipeServings = data.baseServings || 1;
  recipeShowIngredients = true;
  stopRecipeTimer();
  recipeTimerLeft = data.steps[0]?.timer ?? null;
  renderRecipeModal();
  document.getElementById("recipeModalBackdrop").classList.add("open");
}
function closeRecipeModal() {
  stopRecipeTimer();
  document.getElementById("recipeModalBackdrop").classList.remove("open");
  recipeId = null;
}
function goToRecipeStep(idx) {
  const r = getActiveRecipe();
  if (!r || idx < 0 || idx >= r.steps.length) return;
  stopRecipeTimer();
  recipeStepIdx = idx;
  recipeTimerLeft = r.steps[idx]?.timer ?? null;
  renderRecipeModal();
}
function toggleRecipeTimer() {
  const r = getActiveRecipe();
  const step = r.steps[recipeStepIdx];
  if (!step || step.timer == null) return;
  if (recipeTimerRunning) {
    stopRecipeTimer();
  } else {
    if (recipeTimerLeft == null || recipeTimerLeft <= 0) recipeTimerLeft = step.timer;
    recipeTimerRunning = true;
    recipeTimerHandle = setInterval(() => {
      recipeTimerLeft = Math.max(0, recipeTimerLeft - 1);
      if (recipeTimerLeft === 0) stopRecipeTimer();
      updateRecipeTimerUI();
    }, 1000);
  }
  updateRecipeTimerUI();
}
function updateRecipeTimerUI() {
  const el = document.getElementById("recipeTimerDisplay");
  const btn = document.getElementById("recipeTimerBtn");
  if (el) { const m = Math.floor(recipeTimerLeft/60), s = recipeTimerLeft%60; el.textContent = `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`; }
  if (btn) btn.textContent = recipeTimerRunning ? "⏸" : "▶";
}
function renderRecipeModal() {
  const r = getActiveRecipe();
  if (!r) return;
  const scale = recipeServings / (r.baseServings || 1);
  const step = r.steps[recipeStepIdx];
  const total = r.steps.length;

  const ingredientsHtml = r.ingredients.map(ing => {
    const u = ing.unit || "";
    const sep = (u === "" || u === "g" || u === "ml") ? "" : " ";
    return `<div>${fmtAmount(ing.amount * scale)}${sep}${u} ${esc(ing.name)}</div>`;
  }).join("");

  let macroBoxHtml = "";
  if (r.macros) {
    macroBoxHtml = `<div class="recipe-macro-box">Tüm tarif (${fmtAmount(recipeServings)} porsiyon): ~${Math.round(r.macros.kcal*scale)} kcal · ${Math.round(r.macros.protein*scale)}g protein · ${Math.round(r.macros.carbs*scale)}g karb · ${Math.round(r.macros.fat*scale)}g yağ</div>`;
  }
  if (r.cookedYieldG && r.per100g) {
    const yieldG = fmtAmount(r.cookedYieldG * scale);
    macroBoxHtml += `<div class="recipe-macro-box">Pişmiş toplam: ~${yieldG}g · 100g'da ${r.per100g.kcal} kcal, ${r.per100g.protein}g protein, ${r.per100g.carbs}g karb, ${r.per100g.fat}g yağ</div>`;
  }

  document.getElementById("recipeModalCard").innerHTML = `
    <div class="modal-head">
      <div><div class="card-eyebrow">TARİF</div><div class="modal-title">${esc(r.title)}</div></div>
      <button class="modal-close" id="recipeModalCloseBtn">✕</button>
    </div>

    <div class="recipe-servings-row">
      <span class="recipe-servings-label">Porsiyon (gün sayısı gibi düşün)</span>
      <div class="recipe-servings-stepper">
        <button class="stepper-btn" id="recipeServMinus">−</button>
        <span class="stepper-value">${fmtAmount(recipeServings)}</span>
        <button class="stepper-btn" id="recipeServPlus">+</button>
      </div>
    </div>

    <button class="recipe-ingredients-toggle" id="recipeIngToggle">${recipeShowIngredients ? "malzemeleri gizle ▲" : "malzemeleri göster ▼"}</button>
    ${recipeShowIngredients ? `<div class="recipe-ingredients-list">${ingredientsHtml}</div>` : ""}

    <div class="recipe-progress">
      ${r.steps.map((s,i) => `<div class="recipe-progress-seg ${i<=recipeStepIdx?"filled":""}"></div>`).join("")}
    </div>
    <div class="recipe-step-counter">${recipeStepIdx+1} / ${total}</div>
    <div class="recipe-step-title">${esc(step.title)}</div>
    <div class="recipe-step-content">${esc(step.content)}</div>

    ${step.timer != null ? `
      <div class="recipe-timer" id="recipeTimerDisplay">${String(Math.floor((recipeTimerLeft??step.timer)/60)).padStart(2,"0")}:${String((recipeTimerLeft??step.timer)%60).padStart(2,"0")}</div>
      <button class="recipe-timer-btn" id="recipeTimerBtn">${recipeTimerRunning ? "⏸" : "▶"}</button>
    ` : ""}

    <div class="recipe-nav-row">
      <button class="recipe-nav-btn" id="recipePrevBtn" ${recipeStepIdx===0?"disabled":""}>‹</button>
      <button class="recipe-nav-btn" id="recipeNextBtn" ${recipeStepIdx===total-1?"disabled":""}>›</button>
    </div>

    ${macroBoxHtml}
    ${r.note ? `<div class="recipe-note-box">${esc(r.note)}</div>` : ""}
  `;

  document.getElementById("recipeModalCloseBtn").addEventListener("click", closeRecipeModal);
  document.getElementById("recipePrevBtn").addEventListener("click", () => goToRecipeStep(recipeStepIdx-1));
  document.getElementById("recipeNextBtn").addEventListener("click", () => goToRecipeStep(recipeStepIdx+1));
  document.getElementById("recipeIngToggle").addEventListener("click", () => { recipeShowIngredients = !recipeShowIngredients; renderRecipeModal(); });
  document.getElementById("recipeServMinus").addEventListener("click", () => { recipeServings = Math.max(1, recipeServings-1); renderRecipeModal(); });
  document.getElementById("recipeServPlus").addEventListener("click", () => { recipeServings = recipeServings+1; renderRecipeModal(); });
  const timerBtn = document.getElementById("recipeTimerBtn");
  if (timerBtn) timerBtn.addEventListener("click", toggleRecipeTimer);
}
document.getElementById("recipeModalBackdrop").addEventListener("click", (e) => { if (e.target.id === "recipeModalBackdrop") closeRecipeModal(); });

// ---------------------------------------------------------------------------
// Rest timer — floating widget for gym set-to-set breaks (training tab only)
// ---------------------------------------------------------------------------
const REST_PRESETS = [60, 90, 120];
function fmtClock(sec) { const m = Math.floor(sec/60), s = sec%60; return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`; }
function stopRestTimer() { if (restTimerHandle) { clearInterval(restTimerHandle); restTimerHandle = null; } restTimerRunning = false; }
function startRestTimer() {
  if (restTimerLeft <= 0) restTimerLeft = restTimerDuration;
  restTimerRunning = true;
  restTimerHandle = setInterval(() => {
    restTimerLeft = Math.max(0, restTimerLeft - 1);
    if (restTimerLeft === 0) stopRestTimer();
    renderRestTimerWidget();
  }, 1000);
  renderRestTimerWidget();
}
function toggleRestTimer() { if (restTimerRunning) stopRestTimer(); else startRestTimer(); renderRestTimerWidget(); }
function setRestPreset(sec) { stopRestTimer(); restTimerDuration = sec; restTimerLeft = sec; renderRestTimerWidget(); }
function adjustRestTimer(delta) { restTimerLeft = Math.max(0, restTimerLeft + delta); if (!restTimerRunning) restTimerDuration = restTimerLeft; renderRestTimerWidget(); }
function resetRestTimer() { stopRestTimer(); restTimerLeft = restTimerDuration; renderRestTimerWidget(); }

function renderRestTimerWidget() {
  let el = document.getElementById("restTimerWidget");
  if (!el) { el = document.createElement("div"); el.id = "restTimerWidget"; document.body.appendChild(el); }
  if (!profile || editingProfile || activeTab !== "training") { el.innerHTML = ""; return; }

  el.innerHTML = `
    <button class="rest-fab" id="restFabBtn" style="${restTimerOpen ? "display:none;" : ""}">
      ⏱<span class="rest-fab-time">${fmtClock(restTimerLeft)}</span>
    </button>
    <div class="rest-panel ${restTimerOpen ? "open" : ""}">
      <div class="rest-panel-head">
        <span class="rest-panel-title">Mola Sayacı</span>
        <button class="modal-close" id="restCloseBtn">✕</button>
      </div>
      <div class="rest-display">${fmtClock(restTimerLeft)}</div>
      <div class="rest-preset-row">
        ${REST_PRESETS.map(p => `<button class="rest-preset-btn ${restTimerDuration===p?"active":""}" data-preset="${p}">${p}s</button>`).join("")}
      </div>
      <div class="rest-adjust-row">
        <button class="rest-adjust-btn" id="restMinus15">−15</button>
        <button class="rest-adjust-btn" id="restPlus15">+15</button>
      </div>
      <button class="rest-main-btn" id="restToggleBtn">${restTimerRunning ? "Duraklat" : "Başlat"}</button>
      <button class="rest-reset-link" id="restResetBtn">sıfırla</button>
    </div>
  `;

  const fab = document.getElementById("restFabBtn");
  if (fab) fab.addEventListener("click", () => { restTimerOpen = true; renderRestTimerWidget(); });
  document.getElementById("restCloseBtn").addEventListener("click", () => { restTimerOpen = false; renderRestTimerWidget(); });
  document.querySelectorAll("[data-preset]").forEach(b => b.addEventListener("click", () => setRestPreset(Number(b.dataset.preset))));
  document.getElementById("restMinus15").addEventListener("click", () => adjustRestTimer(-15));
  document.getElementById("restPlus15").addEventListener("click", () => adjustRestTimer(15));
  document.getElementById("restToggleBtn").addEventListener("click", toggleRestTimer);
  document.getElementById("restResetBtn").addEventListener("click", resetRestTimer);
}

// ---------------------------------------------------------------------------
// Onboarding
// ---------------------------------------------------------------------------
let obState = null;
let showSetupSection = false; // in edit mode, the setup questions start collapsed
function renderOnboarding() {
  const initial = profile;
  if (!obState) {
    obState = {
      gender: initial?.gender || "erkek",
      age: initial?.age ?? "",
      heightCm: initial?.heightCm ?? "",
      weightKg: initial?.weightKg ?? "",
      bodyFatPct: initial?.bodyFatPct ?? "",
      musclePct: initial?.musclePct ?? "",
      activity: initial?.activity || "orta",
      goal: initial?.goal || "kas",
      trainingDays: initial?.trainingDays || DEFAULT_TRAINING_DAYS,
      trainingStatus: initial?.trainingStatus || "yeni",
      breakMonths: initial?.breakMonths ?? "",
      daysAgoStarted: initial?.programStartDate ? String(daysBetween(initial.programStartDate, today)) : "0",
    };
  }
  const sortedDays = obState.trainingDays.slice().sort((a,b)=>a-b);
  const adaptWeeks = ADAPTATION_WEEKS[obState.trainingStatus] ?? 0;
  const previewOrder = adaptWeeks > 0 ? FULL_BODY_ORDER : SPLIT_ORDER;
  const splitPreview = sortedDays.map((idx,i) => {
    const w = WEEKDAYS.find(w => w.idx === idx);
    const split = DAY_TYPES[previewOrder[i % previewOrder.length]];
    return `${w.short}: ${split.label}`;
  });

  // On first run everything is asked. Afterwards the edit screen shows only the
  // body metrics that actually change week to week; the setup questions
  // (training history, activity, goal, days) sit behind a toggle.
  const setupHtml = `
      <div class="form-label">Antrenman geçmişin nasıl?</div>
      <div class="option-col">
        ${Object.entries(TRAINING_STATUS).map(([k,v]) => `<button class="option-row ${obState.trainingStatus===k?'active':''}" data-status="${k}"><span class="option-row-label">${v.label}</span><span class="option-row-sub">${v.sub}</span></button>`).join("")}
      </div>
      ${obState.trainingStatus === "ara_verdi" ? `<div style="margin-top:10px;">${formFieldHtml("breakMonths","Kaç aydır ara verdin? (opsiyonel)","ay","6")}</div>` : ""}
      ${(obState.trainingStatus === "yeni" || obState.trainingStatus === "ara_verdi") ? `
        <div style="margin-top:10px;">
          ${formFieldHtml("daysAgoStarted","Bu döneme kaç gün önce başladın?","gün","0")}
          <div class="day-preview">Örneğin 5 gündür bu programa devam ediyorsan buraya "5" yaz — adaptasyon fazı ona göre hesaplanır.</div>
        </div>` : ""}

      <div class="form-label" style="margin-top:14px;">Aktivite seviyesi</div>
      <div class="option-col">
        ${Object.entries(ACTIVITY_LEVELS).map(([k,v]) => `<button class="option-row ${obState.activity===k?'active':''}" data-activity="${k}"><span class="option-row-label">${v.label}</span><span class="option-row-sub">${v.sub}</span></button>`).join("")}
      </div>

      <div class="form-label" style="margin-top:14px;">Hedef</div>
      <div class="option-col">
        ${Object.entries(GOALS).map(([k,v]) => `<button class="option-row ${obState.goal===k?'active':''}" data-goal="${k}"><span class="option-row-label">${v.label}</span></button>`).join("")}
      </div>

      <div class="form-label" style="margin-top:14px;">Hangi günler antrenman yapacaksın?</div>
      <div class="day-grid">
        ${WEEKDAYS.map(w => `<button class="day-btn ${obState.trainingDays.includes(w.idx)?'active':''}" data-day="${w.idx}">${w.short}</button>`).join("")}
      </div>
      <div class="day-preview">${splitPreview.length ? splitPreview.join(" · ") : "En az 1 gün seç — seçmezsen varsayılan Pzt/Sal/Prş/Cum kullanılır."}</div>
      ${adaptWeeks > 0 ? `<div class="day-preview">İlk ${adaptWeeks} hafta full body + kardiyo ile başlayacaksın, sonra otomatik split'e geçeceksin.</div>` : ""}
  `;

  return `
    <div class="onboarding-wrap"><div class="onboarding-card">
      <div class="eyebrow">${initial ? "PROFİLİ DÜZENLE" : "TANIŞALIM"}</div>
      <h1 style="margin-bottom:4px;">${initial ? "Bilgilerini güncelle" : "Sana özel program için birkaç bilgi"}</h1>
      <p class="onboarding-sub">${initial ? "Kilo, yağ ve kas oranını güncelle — hedeflerin otomatik yeniden hesaplanır." : "Bu veriler sadece bu cihazda/tarayıcıda saklanır."}</p>

      <div class="gender-row">
        <button class="gender-btn ${obState.gender==='erkek'?'active':''}" data-gender="erkek">Erkek</button>
        <button class="gender-btn ${obState.gender==='kadin'?'active':''}" data-gender="kadin">Kadın</button>
      </div>

      ${formFieldHtml("age","Yaş","yaş","23")}
      ${formFieldHtml("heightCm","Boy","cm","182")}
      ${formFieldHtml("weightKg","Kilo","kg","91.8")}
      ${formFieldHtml("bodyFatPct","Yağ oranı","%","27")}
      ${formFieldHtml("musclePct","Kas oranı (opsiyonel)","%","37.6")}

      ${!initial ? setupHtml : `
        <button class="setup-toggle-btn" id="obSetupToggle">${showSetupSection ? "Program ayarlarını gizle ▲" : "Program ayarlarını değiştir ▼"}</button>
        ${showSetupSection ? setupHtml : ""}
      `}

      <div class="onboarding-actions">
        ${initial ? `<button class="onboarding-cancel-btn" id="obCancel">vazgeç</button>` : ""}
        <button class="onboarding-save-btn" id="obSave" ${canSaveOb() ? "" : "disabled"}>Kaydet</button>
      </div>
    </div></div>
  `;
}
function formFieldHtml(key, label, unit, placeholder) {
  return `
    <div class="form-field">
      <label class="form-label">${label}</label>
      <div class="form-input-row">
        <input class="form-input" type="number" inputmode="decimal" step="0.1" data-field="${key}" value="${obState[key]}" placeholder="${placeholder}" />
        <span class="form-unit">${unit}</span>
      </div>
    </div>`;
}
function canSaveOb() { return obState.gender && obState.age && obState.heightCm && obState.weightKg && obState.bodyFatPct; }

function attachOnboardingHandlers() {
  document.querySelectorAll("[data-gender]").forEach(b => b.addEventListener("click", () => { obState.gender = b.dataset.gender; render(); }));
  document.querySelectorAll("[data-field]").forEach(inp => inp.addEventListener("input", () => { obState[inp.dataset.field] = inp.value; }));
  document.querySelectorAll("[data-status]").forEach(b => b.addEventListener("click", () => { obState.trainingStatus = b.dataset.status; render(); }));
  document.querySelectorAll("[data-activity]").forEach(b => b.addEventListener("click", () => { obState.activity = b.dataset.activity; render(); }));
  document.querySelectorAll("[data-goal]").forEach(b => b.addEventListener("click", () => { obState.goal = b.dataset.goal; render(); }));
  document.querySelectorAll("[data-day]").forEach(b => b.addEventListener("click", () => {
    const idx = Number(b.dataset.day);
    obState.trainingDays = obState.trainingDays.includes(idx) ? obState.trainingDays.filter(d=>d!==idx) : [...obState.trainingDays, idx].sort((a,b)=>a-b);
    render();
  }));
  const cancelBtn = document.getElementById("obCancel");
  if (cancelBtn) cancelBtn.addEventListener("click", () => { editingProfile = false; obState = null; showSetupSection = false; render(); });
  const setupToggle = document.getElementById("obSetupToggle");
  if (setupToggle) setupToggle.addEventListener("click", () => { showSetupSection = !showSetupSection; render(); });
  const saveBtn = document.getElementById("obSave");
  if (saveBtn) saveBtn.addEventListener("click", () => {
    if (!canSaveOb()) return;
    const programStartDate = addDays(isoDate(new Date()), -Math.max(0, Number(obState.daysAgoStarted) || 0));
    profile = {
      gender: obState.gender, activity: obState.activity, goal: obState.goal,
      trainingDays: obState.trainingDays.slice().sort((a,b)=>a-b),
      trainingStatus: obState.trainingStatus,
      breakMonths: obState.trainingStatus === "ara_verdi" && obState.breakMonths !== "" ? Number(obState.breakMonths) : null,
      programStartDate,
      age: Number(obState.age), heightCm: Number(obState.heightCm), weightKg: Number(obState.weightKg),
      bodyFatPct: Number(obState.bodyFatPct), musclePct: obState.musclePct === "" ? null : Number(obState.musclePct),
    };
    persistProfile();
    editingProfile = false;
    obState = null;
    showSetupSection = false;
    render();
  });
}

render();
</script>
</body>
</html>
