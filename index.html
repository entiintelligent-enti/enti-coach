<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glowria Coach</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #12151A; font-family: 'Inter', sans-serif; min-height: 100vh; }
  .app { padding: 24px 16px 100px; }
  .container { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .header { display: flex; justify-content: space-between; align-items: flex-start; }
  .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 2px; color: #4DD8C7; margin-bottom: 4px; }
  h1 { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 24px; color: #EDEFF2; }
  .streak-badge { display: flex; align-items: center; gap: 5px; background: #1B1F26; border: 1px solid #232830; border-radius: 10px; padding: 8px 12px; height: fit-content; }
  .streak-num { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 18px; color: #F5A344; }
  .streak-label { font-size: 11px; color: #8993A1; }
  .date-nav { display: flex; align-items: center; justify-content: space-between; background: #1B1F26; border: 1px solid #232830; border-radius: 12px; padding: 10px 6px; }
  .nav-btn { background: #232830; border: none; border-radius: 8px; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #EDEFF2; font-size: 16px; }
  .date-label { font-family: 'Space Grotesk', sans-serif; font-size: 16px; color: #EDEFF2; text-transform: capitalize; }
  .today-link { background: none; border: none; color: #4DD8C7; font-size: 11px; font-family: 'JetBrains Mono', monospace; margin-top: 2px; cursor: pointer; display: block; margin-left: auto; margin-right: auto; }
  .card { background: #1B1F26; border: 1px solid #232830; border-radius: 14px; padding: 18px; }
  .card-head-row { display: flex; justify-content: space-between; align-items: flex-start; }
  .card-eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 1.5px; color: #8993A1; }
  .card-title { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 19px; color: #EDEFF2; margin-top: 4px; }
  .card-sub { font-size: 13px; color: #8993A1; margin-top: 2px; }
  .progress-track { height: 5px; background: #232830; border-radius: 3px; margin-top: 14px; overflow: hidden; }
  .progress-fill { height: 100%; background: #4DD8C7; border-radius: 3px; }
  .rest-note { font-size: 13px; color: #8993A1; margin-top: 14px; line-height: 1.5; }
  .ex-list { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .ex-row { display: flex; align-items: center; gap: 8px; background: #181C22; border: 1px solid #232830; border-radius: 10px; padding: 8px 8px 8px 12px; }
  .ex-row.done { background: #17221F; border-color: #2A3A34; }
  .checkbox-btn { background: none; border: none; padding: 0; cursor: pointer; flex-shrink: 0; }
  .checkbox { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid #3A4048; display: flex; align-items: center; justify-content: center; }
  .checkbox.done { background: #4DD8C7; border-color: #4DD8C7; }
  .ex-name-btn { background: none; border: none; padding: 0; cursor: pointer; flex: 1; text-align: left; }
  .ex-name { font-size: 14px; color: #EDEFF2; font-weight: 500; }
  .ex-name.done { color: #7C8892; text-decoration: line-through; }
  .ex-scheme { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8993A1; flex-shrink: 0; }
  .info-btn { background: #1F2A28; border: 1px solid #2A3A38; border-radius: 7px; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; color: #4DD8C7; font-size: 13px; font-weight: 700; }
  .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .metric-cell { background: #181C22; border: 1px solid #232830; border-radius: 10px; padding: 12px; }
  .metric-label-row { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #8993A1; font-weight: 500; }
  .metric-input { width: 100%; background: transparent; border: none; color: #EDEFF2; font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 700; margin-top: 6px; padding: 0; outline: none; }
  .metric-target-row { display: flex; justify-content: space-between; margin-top: 2px; font-size: 11px; color: #5C6470; }
  .metric-target-row .unit-mono { font-family: 'JetBrains Mono', monospace; }
  .metric-track { height: 3px; background: #232830; border-radius: 2px; margin-top: 8px; overflow: hidden; }
  .metric-fill { height: 100%; background: #4DD8C7; border-radius: 2px; }
  .week-grid { display: flex; justify-content: space-between; align-items: flex-end; height: 90px; margin-top: 14px; gap: 6px; }
  .week-col { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; }
  .week-bar-track { width: 100%; height: 60px; background: #181C22; border-radius: 5px; display: flex; align-items: flex-end; overflow: hidden; }
  .week-bar-fill { width: 100%; background: #4DD8C7; border-radius: 5px 5px 0 0; min-height: 2px; }
  .week-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #8993A1; text-transform: capitalize; }
  .week-label.today { color: #4DD8C7; font-weight: 700; }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(8,10,13,0.75); display: none; align-items: flex-end; justify-content: center; z-index: 50; }
  .modal-backdrop.open { display: flex; }
  .modal-card { background: #1B1F26; border: 1px solid #232830; border-radius: 18px 18px 0 0; padding: 18px; width: 100%; max-width: 480px; max-height: 85vh; overflow-y: auto; }
  .modal-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
  .modal-title { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 19px; color: #EDEFF2; margin-top: 4px; }
  .modal-close { background: #232830; border: none; border-radius: 8px; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #EDEFF2; font-size: 16px; }
  .modal-img-row { display: flex; gap: 8px; }
  .modal-img { width: 50%; border-radius: 10px; background: #0F1216; object-fit: cover; aspect-ratio: 1/1; }
  .modal-tip { font-size: 13.5px; color: #C3C9D0; line-height: 1.55; margin-top: 14px; }
  .modal-scheme { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #4DD8C7; margin-top: 12px; }
  input:focus, textarea:focus { outline: 2px solid #4DD8C7; outline-offset: 1px; }
  button:focus-visible { outline: 2px solid #4DD8C7; outline-offset: 2px; }

  .profile-edit-btn { display: flex; align-items: center; gap: 5px; background: #1F2A28; border: 1px solid #2A3A38; border-radius: 7px; padding: 6px 10px; color: #4DD8C7; font-size: 11.5px; font-family: 'JetBrains Mono', monospace; cursor: pointer; flex-shrink: 0; }
  .gauge-wrap { margin-top: 16px; }
  .gauge-head-row { display: flex; justify-content: space-between; margin-bottom: 6px; }
  .gauge-label { font-size: 12.5px; color: #8993A1; }
  .gauge-value { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; font-weight: 700; }
  .gauge-track { position: relative; display: flex; height: 8px; border-radius: 4px; overflow: hidden; }
  .gauge-marker { position: absolute; top: -3px; width: 3px; height: 14px; background: #EDEFF2; border-radius: 2px; transform: translateX(-50%); }
  .gauge-zone-labels { display: flex; justify-content: space-between; margin-top: 6px; font-size: 9.5px; color: #5C6470; font-family: 'JetBrains Mono', monospace; }
  .mini-stats-row { display: flex; gap: 8px; margin-top: 16px; }
  .mini-stat { flex: 1; background: #181C22; border: 1px solid #232830; border-radius: 10px; padding: 10px 12px; }
  .mini-stat-label { font-size: 10.5px; color: #8993A1; }
  .mini-stat-value { font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700; color: #EDEFF2; margin-top: 3px; }

  .calorie-hero { font-family: 'JetBrains Mono', monospace; font-size: 40px; font-weight: 700; color: #4DD8C7; margin-top: 6px; }
  .calorie-hero-unit { font-size: 16px; color: #8993A1; }
  .macro-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 16px; }
  .macro-block { background: #181C22; border: 1px solid #232830; border-radius: 10px; padding: 10px; }
  .macro-label-row { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #8993A1; }
  .macro-value { font-family: 'JetBrains Mono', monospace; font-size: 17px; font-weight: 700; margin-top: 4px; }
  .macro-kcal { font-size: 10.5px; color: #5C6470; margin-top: 2px; }
  .meal-list { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  .meal-row { background: #181C22; border: 1px solid #232830; border-radius: 10px; padding: 12px; }
  .meal-head-row { display: flex; justify-content: space-between; align-items: baseline; }
  .meal-name { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 14px; color: #EDEFF2; }
  .meal-macro { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #4DD8C7; }
  .meal-items { font-size: 12.5px; color: #8993A1; margin-top: 6px; line-height: 1.5; }
  .meal-footnote { font-size: 11px; color: #5C6470; margin-top: 10px; line-height: 1.5; }
  .remaining-row { display: flex; gap: 10px; margin-top: 12px; }
  .remaining-block { flex: 1; background: #181C22; border: 1px solid #232830; border-radius: 10px; padding: 12px 14px; text-align: center; }
  .remaining-value { font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 700; color: #4DD8C7; }
  .remaining-label { font-size: 11px; color: #8993A1; margin-top: 3px; }
  .meal-analyzing { font-size: 12.5px; color: #8993A1; margin-top: 10px; font-family: 'JetBrains Mono', monospace; }
  .meal-result-card { background: #151F1C; border: 1px solid #2A3A34; border-radius: 10px; padding: 12px; margin-top: 12px; }
  .meal-result-head { display: flex; justify-content: space-between; align-items: baseline; }
  .meal-result-title { font-size: 12.5px; color: #4DD8C7; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
  .meal-result-advice { font-size: 13px; color: #C3C9D0; line-height: 1.5; margin-top: 8px; }
  .logged-meal-list { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
  .logged-meal-row { display: flex; align-items: center; gap: 8px; background: #181C22; border: 1px solid #232830; border-radius: 10px; padding: 9px 10px 9px 12px; }
  .logged-meal-text { font-size: 13px; color: #EDEFF2; }
  .logged-meal-macro { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8993A1; margin-top: 2px; }
  .logged-meal-remove { background: none; border: none; cursor: pointer; padding: 4px; flex-shrink: 0; color: #5C6470; font-size: 14px; }
  .chat-error { font-size: 12px; color: #F0576B; margin-top: 10px; }

  .chat-scroll { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; max-height: 260px; overflow-y: auto; padding-right: 2px; }
  .chat-bubble { font-size: 13px; line-height: 1.5; padding: 9px 12px; border-radius: 12px; max-width: 85%; white-space: pre-wrap; }
  .chat-bubble.user { align-self: flex-end; background: #1F2A28; color: #EDEFF2; border-bottom-right-radius: 3px; margin-left: auto; }
  .chat-bubble.assistant { align-self: flex-start; background: #181C22; color: #C3C9D0; border-bottom-left-radius: 3px; }
  .chat-input-row { display: flex; gap: 8px; margin-top: 12px; }
  .chat-input { flex: 1; background: #181C22; border: 1px solid #232830; border-radius: 10px; padding: 11px 12px; color: #EDEFF2; font-size: 13px; font-family: 'Inter', sans-serif; }
  .chat-send-btn { background: #4DD8C7; border: none; border-radius: 10px; width: 42px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; color: #0C1512; font-weight: 700; }

  .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #151920; border-top: 1px solid #232830; padding: 8px 0 max(8px, env(safe-area-inset-bottom)); z-index: 40; }
  .tab-bar-inner { max-width: 480px; margin: 0 auto; display: flex; }
  .tab-btn { flex: 1; background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; cursor: pointer; color: #5C6470; font-size: 18px; }
  .tab-btn.active { color: #4DD8C7; }
  .tab-label { font-size: 10.5px; font-family: 'JetBrains Mono', monospace; }

  .onboarding-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  .onboarding-card { max-width: 420px; width: 100%; }
  .onboarding-sub { font-size: 13px; color: #8993A1; margin-top: 8px; margin-bottom: 20px; line-height: 1.5; }
  .gender-row { display: flex; gap: 8px; margin-bottom: 18px; }
  .gender-btn { flex: 1; background: #1B1F26; border: 1px solid #232830; border-radius: 10px; padding: 12px 0; color: #8993A1; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 14px; cursor: pointer; }
  .gender-btn.active { background: #17322F; border-color: #4DD8C7; color: #4DD8C7; }
  .form-field { margin-bottom: 14px; }
  .form-label { font-size: 12.5px; color: #8993A1; margin-bottom: 6px; display: block; }
  .form-input-row { display: flex; align-items: center; justify-content: space-between; background: #1B1F26; border: 1px solid #232830; border-radius: 10px; padding: 12px 14px; }
  .form-input { background: transparent; border: none; color: #EDEFF2; font-family: 'JetBrains Mono', monospace; font-size: 17px; font-weight: 700; width: 100%; padding: 0; outline: none; }
  .form-unit { font-size: 12px; color: #5C6470; font-family: 'JetBrains Mono', monospace; flex-shrink: 0; margin-left: 8px; }
  .option-col { display: flex; flex-direction: column; gap: 8px; }
  .option-row { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; background: #1B1F26; border: 1px solid #232830; border-radius: 10px; padding: 10px 14px; cursor: pointer; text-align: left; width: 100%; }
  .option-row.active { background: #17322F; border-color: #4DD8C7; }
  .option-row-label { font-size: 13.5px; color: #EDEFF2; font-weight: 600; }
  .option-row-sub { font-size: 11px; color: #8993A1; }
  .day-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .day-btn { background: #1B1F26; border: 1px solid #232830; border-radius: 8px; padding: 10px 0; color: #8993A1; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; cursor: pointer; }
  .day-btn.active { background: #17322F; border-color: #4DD8C7; color: #4DD8C7; }
  .day-preview { font-size: 11.5px; color: #5C6470; margin-top: 8px; line-height: 1.5; }
  .onboarding-actions { display: flex; gap: 10px; margin-top: 20px; }
  .onboarding-cancel-btn { flex: 1; background: #1B1F26; border: 1px solid #232830; border-radius: 10px; padding: 13px 0; color: #8993A1; font-size: 14px; font-weight: 600; cursor: pointer; }
  .onboarding-save-btn { flex: 2; background: #4DD8C7; border: none; border-radius: 10px; padding: 13px 0; color: #0C1512; font-size: 14px; font-weight: 700; cursor: pointer; }
  .onboarding-save-btn:disabled { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>
  <div id="root"></div>
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal-card" id="modalCard"></div>
  </div>

<script>
// ---------------------------------------------------------------------------
// Data
// ---------------------------------------------------------------------------
const IMG_BASE = "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/";
const MEDIA = {
  bench: { dbId: "Barbell_Bench_Press_-_Medium_Grip", tip: "Sırtın bankta düz, ayaklar yerde sabit. Bar göğüs hizasına iner, dirsekler tam kilitlenmeden yukarı it." },
  incline_db: { dbId: "Incline_Dumbbell_Press", tip: "Bank 30-45° eğimli. Dumbbell'lar göğüs üstünden başlar, kontrollü iner." },
  shoulder_press: { dbId: "Dumbbell_Shoulder_Press", tip: "Otur, sırt destekli. Dumbbell'ları omuz hizasından tepeye it, tam kilitleme." },
  lateral_raise: { dbId: "Side_Lateral_Raise", tip: "Hafif ağırlık, dirsekler az bükülü. Kollar yanlara omuz hizasına kadar kalkar, sallanma yok." },
  triceps_pushdown: { dbId: "Triceps_Pushdown", tip: "Dirsekler gövdeye sabit kalır, sadece ön kol hareket eder, tam kilitleme." },
  dips: { dbId: "Dips_-_Triceps_Version", tip: "Gövde dik, dirsekler geriye açılmadan aşağı-yukarı iner. Triceps'e odaklı versiyon." },
  back_squat: { dbId: "Barbell_Squat", tip: "Bar üst sırtta, ayaklar omuz genişliğinde. Kalça geriye, dizler ayak ucunu geçmeden çök." },
  leg_press: { dbId: "Leg_Press", tip: "Ayaklar platformda omuz genişliğinde. Dizler tam kilitlenmeden it, kontrollü indir." },
  walking_lunge: { dbId: "Barbell_Walking_Lunge", tip: "Uzun adım at, arka diz yere yakın iner, ön diz ayak ucunu geçmez." },
  leg_extension: { dbId: "Leg_Extensions", tip: "Sırt sabit, sadece dizden aç. Tepede 1 saniye sık, kontrollü indir." },
  calf_raise_standing: { dbId: "Rocking_Standing_Calf_Raise", tip: "Ayak parmak ucunda yüksel, tepede sık, tam esnemeye kadar indir." },
  deadlift: { dbId: "Barbell_Deadlift", tip: "Sırt düz, kalça geriye. Bar bacağa yakın kalarak kalça ve dizle birlikte kalk." },
  lat_pulldown: { dbId: "Wide-Grip_Lat_Pulldown", tip: "Geniş tutuş, barı üst göğse çek, omuzları aşağı-geriye sık." },
  cable_row: { dbId: "Seated_Cable_Rows", tip: "Sırt dik, kürek kemiklerini sık, dirsekler gövdeye yakın çek." },
  face_pull: { dbId: "Face_Pull", tip: "İp/kablo yüz hizasına çekilir, dirsekler yukarıda, omuz sağlığı için önemli." },
  barbell_curl: { dbId: "Barbell_Curl", tip: "Dirsekler gövdeye sabit, sadece ön kol kıvrılır, sallanma yok." },
  hammer_curl: { dbId: "Hammer_Curls", tip: "Avuç içi birbirine bakar (çekiç tutuş), dirsek sabit kalır." },
  rdl: { dbId: "Romanian_Deadlift", tip: "Dizler hafif bükülü, kalçadan öne eğil, sırt düz, hamstring gerilir." },
  hip_thrust: { dbId: "Barbell_Hip_Thrust", tip: "Üst sırt banka yaslı, bar kalçada. Topuklardan it, tepede kalçayı sık." },
  leg_curl: { dbId: "Seated_Leg_Curl", tip: "Diz altı pedin arkasında, dizden bükerek pedi aşağı çek." },
  bulgarian_split: { dbId: "Split_Squat_with_Dumbbells", tip: "Arka ayak yükseltilmiş, ön bacak dik iner, denge ön bacakta." },
  calf_raise_seated: { dbId: "Seated_Calf_Raise", tip: "Dizler bükülü otur, ayak parmak ucunda yüksel, kontrollü indir." },
};
function exImg(id, i) { return IMG_BASE + encodeURIComponent(MEDIA[id].dbId) + "/" + i + ".jpg"; }

const DAY_TYPES = {
  upper_push: { label: "Upper — İtiş", sub: "Göğüs / Omuz / Triceps", exercises: [
    { id: "bench", name: "Bench Press", scheme: "4 × 6-8" },
    { id: "incline_db", name: "Incline Dumbbell Press", scheme: "3 × 8-10" },
    { id: "shoulder_press", name: "Seated Shoulder Press", scheme: "3 × 8-10" },
    { id: "lateral_raise", name: "Lateral Raise", scheme: "3 × 12-15" },
    { id: "triceps_pushdown", name: "Triceps Pushdown", scheme: "3 × 10-12" },
    { id: "dips", name: "Dips", scheme: "2 × 10-12" },
  ]},
  lower_quad: { label: "Lower — Quad", sub: "Squat ağırlıklı", exercises: [
    { id: "back_squat", name: "Back Squat", scheme: "4 × 6-8" },
    { id: "leg_press", name: "Leg Press", scheme: "3 × 10-12" },
    { id: "walking_lunge", name: "Walking Lunge", scheme: "3 × 10/bacak" },
    { id: "leg_extension", name: "Leg Extension", scheme: "3 × 12-15" },
    { id: "calf_raise_standing", name: "Standing Calf Raise", scheme: "4 × 12-15" },
  ]},
  upper_pull: { label: "Upper — Çekiş", sub: "Sırt / Biceps", exercises: [
    { id: "deadlift", name: "Deadlift", scheme: "4 × 6-8" },
    { id: "lat_pulldown", name: "Lat Pulldown", scheme: "3 × 8-10" },
    { id: "cable_row", name: "Seated Cable Row", scheme: "3 × 10-12" },
    { id: "face_pull", name: "Face Pull", scheme: "3 × 15" },
    { id: "barbell_curl", name: "Barbell Curl", scheme: "3 × 10-12" },
    { id: "hammer_curl", name: "Hammer Curl", scheme: "2 × 10-12" },
  ]},
  lower_hip: { label: "Lower — Hip/Hamstring", sub: "Deadlift varyasyonu", exercises: [
    { id: "rdl", name: "Romanian Deadlift", scheme: "4 × 8-10" },
    { id: "hip_thrust", name: "Hip Thrust", scheme: "3 × 10-12" },
    { id: "leg_curl", name: "Leg Curl", scheme: "3 × 12-15" },
    { id: "bulgarian_split", name: "Bulgarian Split Squat", scheme: "3 × 10/bacak" },

  rest: { label: "Dinlenme", sub: "Serbest gün", exercises: [] },
};
const SPLIT_ORDER = ["upper_push", "lower_quad", "upper_pull", "lower_hip"];
const DEFAULT_TRAINING_DAYS = [0, 1, 3, 4];
const WEEKDAYS = [
  { idx: 0, short: "Pzt" }, { idx: 1, short: "Sal" }, { idx: 2, short: "Çrş" },
  { idx: 3, short: "Prş" }, { idx: 4, short: "Cum" }, { idx: 5, short: "Cmt" }, { idx: 6, short: "Paz" },
];
const ACTIVITY_LEVELS = {
  dusuk: { label: "Az hareketli", sub: "Masa başı iş", mult: 1.2 },
  orta: { label: "Orta hareketli", sub: "Haftada 4 gün spor", mult: 1.45 },
  yuksek: { label: "Çok hareketli", sub: "Fiziksel iş + spor", mult: 1.7 },
};
const GOALS = {
  kas: { label: "Kas yapmak", mult: 1.10 },
  kilo_verme: { label: "Yağ yakmak", mult: 0.82 },
  koruma: { label: "Formu korumak", mult: 1.0 },
};
const MEAL_PLAN = [
  { name: "Kahvaltı", ratio: 0.25, items: "3-4 yumurta, yulaf ezmesi, yoğunlaştırılmış yoğurt, mevsim meyvesi" },
  { name: "Öğle", ratio: 0.30, items: "Tavuk göğsü veya kırmızı et, pirinç/bulgur, bol sebze, zeytinyağı" },
  { name: "Akşam", ratio: 0.30, items: "Balık veya tavuk, tatlı patates/bulgur, yeşil salata" },
  { name: "Ara Öğün", ratio: 0.15, items: "Whey protein veya kefir, kuruyemiş, meyve" },
];

const LOGS_KEY = "glowria-coach-logs-v2";
const PROFILE_KEY = "glowria-coach-profile-v2";

// ---------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function isoDate(d) { const y = d.getFullYear(); const m = String(d.getMonth()+1).padStart(2,"0"); const day = String(d.getDate()).padStart(2,"0"); return `${y}-${m}-${day}`; }
function addDays(dateStr, n) { const d = new Date(dateStr + "T00:00:00"); d.setDate(d.getDate() + n); return isoDate(d); }
function turkishDate(dateStr) { const d = new Date(dateStr + "T00:00:00"); return d.toLocaleDateString("tr-TR", { weekday: "long", day: "numeric", month: "long" }); }
function dayTypeForDate(dateStr, trainingDays) {
  const days = (trainingDays && trainingDays.length ? trainingDays : DEFAULT_TRAINING_DAYS).slice().sort((a,b)=>a-b);
  const d = new Date(dateStr + "T00:00:00");
  const weekday = d.getDay() === 0 ? 6 : d.getDay() - 1;
  const pos = days.indexOf(weekday);
  if (pos === -1) return "rest";
  return SPLIT_ORDER[pos % SPLIT_ORDER.length];
}
function emptyEntry(dateStr, trainingDays) {
  return { dayType: dayTypeForDate(dateStr, trainingDays), doneExercises: {}, calories: null, protein: null, water: null, sleep: null, meals: [] };
}
function sumMeals(meals) {
  return (meals || []).reduce((acc, m) => ({ kcal: acc.kcal + (m.kcal||0), protein: acc.protein + (m.protein||0), carbs: acc.carbs + (m.carbs||0), fat: acc.fat + (m.fat||0) }), { kcal:0, protein:0, carbs:0, fat:0 });
}
function calcBMR(p) { const base = 10*p.weightKg + 6.25*p.heightCm - 5*p.age; return p.gender === "kadin" ? base - 161 : base + 5; }
function calcBMI(p) { const h = p.heightCm/100; return p.weightKg/(h*h); }
function computeNutritionTargets(p) {
  const bmr = calcBMR(p);
  const safeBmr = Number.isFinite(bmr) ? bmr : 1800;
  const maint = safeBmr * (ACTIVITY_LEVELS[p.activity]?.mult || 1.45);
  const calorieTarget = Math.round(maint * (GOALS[p.goal]?.mult || 1.0));
  const proteinG = Math.round((p.weightKg||0) * 2.0);
  const fatG = Math.round((calorieTarget * 0.25) / 9);
  const carbG = Math.max(0, Math.round((calorieTarget - proteinG*4 - fatG*9) / 4));
  return { bmr: Math.round(safeBmr), maint: Math.round(maint), calorieTarget, proteinG, fatG, carbG };
}
function bodyFatZones(gender) {
  return gender === "kadin"
    ? { min: 10, max: 45, bp: [16,27,32], labels: ["Düşük","Sağlıklı","Yüksek","Obez"] }
    : { min: 4, max: 38, bp: [8,19,25], labels: ["Düşük","Sağlıklı","Yüksek","Obez"] };
}
function esc(s) { const d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; }

// ---------------------------------------------------------------------------
// AI helpers (only work when this page's fetch to Anthropic succeeds —
// on GitHub Pages this will typically fail without your own API key)
// ---------------------------------------------------------------------------
async function callClaude(systemPrompt, messages, maxTokens) {
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: maxTokens || 800, system: systemPrompt, messages }),
  });
  const data = await response.json();
  if (!data || !data.content) throw new Error("Boş yanıt");
  return data.content.map(b => b.text || "").join("").trim();
}
async function analyzeMealAndAdvise(description, profile, targets, dayCtx, priorTotals) {
  const remainingKcal = Math.max(0, targets.calorieTarget - priorTotals.kcal);
  const remainingProtein = Math.max(0, targets.proteinG - priorTotals.protein);
  const systemPrompt = `Sen Glowria Coach'sun, Türk mutfağına aşina bir beslenme koçusun.
Kullanıcı az önce yediği bir öğünü anlatıyor. 1) Türk ev yemeği porsiyonlarına göre YAKLAŞIK kalori/makro tahmin et. 2) Günün geri kalanı için kısa somut tavsiye yaz (bugünün antrenmanını da hesaba kat).
KULLANICI: ${profile.gender === "kadin" ? "Kadın" : "Erkek"}, ${profile.age} yaş, hedefi: ${GOALS[profile.goal]?.label}, yağ oranı %${profile.bodyFatPct}.
GÜNLÜK HEDEF: ${targets.calorieTarget} kcal, ${targets.proteinG}g protein. BU ÖĞÜNDEN ÖNCE ALINAN: ${Math.round(priorTotals.kcal)} kcal, ${Math.round(priorTotals.protein)}g protein. KALAN BÜTÇE: ${Math.round(remainingKcal)} kcal, ${Math.round(remainingProtein)}g protein.
BUGÜNÜN ANTRENMANI: ${dayCtx.dayLabel}${dayCtx.totalEx > 0 ? ` (${dayCtx.doneEx}/${dayCtx.totalEx} tamamlandı)` : " (dinlenme günü)"}.
SADECE şu JSON formatında yanıt ver, başka hiçbir şey ekleme: {"kcal": sayı, "protein": sayı, "carbs": sayı, "fat": sayı, "advice": "2-3 cümlelik Türkçe tavsiye"}`;
  const raw = await callClaude(systemPrompt, [{ role: "user", content: description }], 500);
  const clean = raw.replace(/```json|```/g, "").trim();
  const parsed = JSON.parse(clean);
  return { kcal: Number(parsed.kcal)||0, protein: Number(parsed.protein)||0, carbs: Number(parsed.carbs)||0, fat: Number(parsed.fat)||0, advice: String(parsed.advice||"") };
}
async function askCoach(userMessage, profile, targets, history, dayCtx) {
  const loggedLine = [
    dayCtx.calories != null ? `${dayCtx.calories} kcal alındı` : "kalori henüz girilmedi",
    dayCtx.protein != null ? `${dayCtx.protein}g protein alındı` : "protein henüz girilmedi",
    dayCtx.water != null ? `${dayCtx.water}ml su içildi` : "su henüz girilmedi",
    dayCtx.sleep != null ? `${dayCtx.sleep} saat uyudu` : "uyku henüz girilmedi",
  ].join(", ");
  const systemPrompt = `Sen Glowria Coach'sun, kullanıcıyı tanıyan samimi bir Türkçe fitness/beslenme koçusun. "aga" gibi samimi hitap kullanabilirsin ama saygılı kal.
PROFİL: ${profile.gender === "kadin" ? "Kadın" : "Erkek"}, ${profile.age} yaş, ${profile.heightCm}cm, ${profile.weightKg}kg, yağ %${profile.bodyFatPct}${profile.musclePct ? `, kas %${profile.musclePct}` : ""}. Hedef: ${GOALS[profile.goal]?.label}.
GÜNLÜK HEDEF: ${targets.calorieTarget} kcal, ${targets.proteinG}g protein, ${targets.carbG}g karbonhidrat, ${targets.fatG}g yağ.
BUGÜN (${dayCtx.dateLabel}): antrenman günü ${dayCtx.dayLabel}${dayCtx.totalEx > 0 ? ` (${dayCtx.doneEx}/${dayCtx.totalEx} tamamlandı)` : ""}. Bugüne kadar: ${loggedLine}. Seri: ${dayCtx.streak} gün.
Cevaplarını profiline, hedefine ve bugünkü duruma göre şekillendir, genel tavsiye verme. Kısa ve uygulanabilir yaz. Tıbbi teşhis koyma.`;
  return callClaude(systemPrompt, [...history, { role: "user", content: userMessage }], 1000);
}

// State
// ---------------------------------------------------------------------------
let logs = {};
let profile = null;
try { const raw = localStorage.getItem(LOGS_KEY); logs = raw ? JSON.parse(raw) : {}; } catch (e) { logs = {}; }
try { const raw = localStorage.getItem(PROFILE_KEY); profile = raw ? JSON.parse(raw) : null; } catch (e) { profile = null; }

const today = isoDate(new Date());
let activeDate = today;
let activeTab = "home";
let editingProfile = false;
let coachMessages = [];
let coachLoading = false;
let coachError = false;

function persistLogs() { try { localStorage.setItem(LOGS_KEY, JSON.stringify(logs)); } catch (e) { console.error(e); } }
function persistProfile() { try { localStorage.setItem(PROFILE_KEY, JSON.stringify(profile)); } catch (e) { console.error(e); } }

function getEntry(dateStr) {
  const td = profile?.trainingDays || DEFAULT_TRAINING_DAYS;
  return logs[dateStr] || emptyEntry(dateStr, td);
}
function updateEntry(dateStr, patch) {
  logs[dateStr] = { ...getEntry(dateStr), ...patch };
  persistLogs();
}
function computeStreak() {
  const td = profile?.trainingDays || DEFAULT_TRAINING_DAYS;
  let count = 0, cursor = today;
  for (let i = 0; i < 60; i++) {
    const dt = dayTypeForDate(cursor, td);
    if (dt === "rest") { cursor = addDays(cursor, -1); continue; }
    const e = logs[cursor];
    const total = DAY_TYPES[dt].exercises.length;
    const done = e ? DAY_TYPES[dt].exercises.filter(ex => e.doneExercises && e.doneExercises[ex.id]).length : 0;
    if (total > 0 && done === total) { count++; cursor = addDays(cursor, -1); } else break;
  }
  return count;
}
function todayContext() {
  const td = profile?.trainingDays || DEFAULT_TRAINING_DAYS;
  const dt = dayTypeForDate(today, td);
  const info = DAY_TYPES[dt];
  const e = getEntry(today);
  const doneEx = info.exercises.filter(ex => e.doneExercises[ex.id]).length;
  return { dateLabel: turkishDate(today), dayLabel: info.label, totalEx: info.exercises.length, doneEx, calories: e.calories, protein: e.protein, water: e.water, sleep: e.sleep, streak: computeStreak() };
}

// ---------------------------------------------------------------------------
function render() {
  const root = document.getElementById("root");
  if (!profile || editingProfile) {
    root.innerHTML = `<div class="app">${renderOnboarding()}</div>`;
    attachOnboardingHandlers();
    return;
  }

  const entry = getEntry(activeDate);
  const targets = computeNutritionTargets(profile);
  const streak = computeStreak();

  let bodyHtml = "";
  if (activeTab === "home") bodyHtml = renderHome(entry, targets, streak);
  else if (activeTab === "nutrition") bodyHtml = renderNutrition(entry, targets);
  else bodyHtml = renderTraining(entry);

  root.innerHTML = `
    <div class="app">
      <div class="container">
        <div class="header">
          <div>
            <div class="eyebrow">GLOWRIA COACH</div>
            <h1>${activeTab === "home" ? "Ana Sayfa" : activeTab === "nutrition" ? "Beslenme" : "Antrenman"}</h1>
          </div>
          <div class="streak-badge"><span class="streak-num">${streak}</span><span class="streak-label">gün seri</span></div>
        </div>
        <div class="date-nav">
          <button class="nav-btn" id="navPrev">‹</button>
          <div style="text-align:center; flex:1;">
            <div class="date-label">${turkishDate(activeDate)}</div>
            ${activeDate !== today ? `<button class="today-link" id="navToday">bugüne dön</button>` : ""}
          </div>
          <button class="nav-btn" id="navNext">›</button>
        </div>
        ${bodyHtml}
      </div>
    </div>
    <div class="tab-bar">
      <div class="tab-bar-inner">
        <button class="tab-btn ${activeTab==='home'?'active':''}" data-tab="home">🏠<span class="tab-label">Ana Sayfa</span></button>
        <button class="tab-btn ${activeTab==='nutrition'?'active':''}" data-tab="nutrition">🍽️<span class="tab-label">Beslenme</span></button>
        <button class="tab-btn ${activeTab==='training'?'active':''}" data-tab="training">🏋️<span class="tab-label">Antrenman</span></button>
      </div>
    </div>
  `;

  document.getElementById("navPrev").addEventListener("click", () => { activeDate = addDays(activeDate, -1); render(); });
  document.getElementById("navNext").addEventListener("click", () => { activeDate = addDays(activeDate, 1); render(); });
  const navToday = document.getElementById("navToday");
  if (navToday) navToday.addEventListener("click", () => { activeDate = today; render(); });
  document.querySelectorAll(".tab-btn").forEach(b => b.addEventListener("click", () => { activeTab = b.dataset.tab; render(); }));
  document.querySelectorAll("[data-edit-profile]").forEach(b => b.addEventListener("click", () => { editingProfile = true; render(); }));

  if (activeTab === "home") attachHomeHandlers(entry, targets);
  if (activeTab === "nutrition") attachNutritionHandlers(entry, targets);
  if (activeTab === "training") attachTrainingHandlers(entry);
}

function renderHome(entry, targets, streak) {
  const bmi = calcBMI(profile);
  const fz = bodyFatZones(profile.gender);
  const bounds = [fz.min, ...fz.bp, fz.max];
  const widths = bounds.slice(0,-1).map((b,i) => ((bounds[i+1]-b)/(fz.max-fz.min))*100);
  const colors = ["#5BA8F5","#4DD8C7","#F5A344","#F0576B"];
  const markerPct = clamp(((profile.bodyFatPct - fz.min)/(fz.max-fz.min))*100, 1, 99);
  let zoneIdx = fz.bp.findIndex(b => profile.bodyFatPct < b);
  if (zoneIdx === -1) zoneIdx = fz.bp.length;

  const last7 = [];
  for (let i = 6; i >= 0; i--) { const d = addDays(today, -i); const e = logs[d] || null; last7.push({ date: d, calories: e?.calories ?? null }); }
  const weekHtml = last7.map(d => {
    const pct = d.calories ? Math.min(100, Math.round((d.calories/targets.calorieTarget)*100)) : 0;
    const isToday = d.date === today;
    const wd = new Date(d.date+"T00:00:00").toLocaleDateString("tr-TR",{weekday:"short"}).slice(0,2);
    return `<div class="week-col"><div class="week-bar-track"><div class="week-bar-fill" style="height:${pct}%"></div></div><div class="week-label ${isToday?'today':''}">${wd}</div></div>`;
  }).join("");

  return `
    <section class="card">
      <div class="card-head-row">
        <div>
          <div class="card-eyebrow">PROFİL</div>
          <div class="card-title">${profile.weightKg} kg</div>
          <div class="card-sub">${profile.gender==='kadin'?'Kadın':'Erkek'} · ${profile.age} yaş · ${profile.heightCm} cm</div>
        </div>
        <button class="profile-edit-btn" data-edit-profile="1">✎ düzenle</button>
      </div>
      <div class="gauge-wrap">
        <div class="gauge-head-row"><span class="gauge-label">Yağ oranı</span><span class="gauge-value" style="color:${colors[zoneIdx]}">${profile.bodyFatPct}% · ${fz.labels[zoneIdx]}</span></div>
        <div class="gauge-track">${widths.map((w,i)=>`<div style="width:${w}%; background:${colors[i]}; height:100%;"></div>`).join("")}<div class="gauge-marker" style="left:${markerPct}%"></div></div>
        <div class="gauge-zone-labels">${fz.labels.map(l=>`<span>${l}</span>`).join("")}</div>
      </div>
      <div class="mini-stats-row">
        <div class="mini-stat"><div class="mini-stat-label">BMI</div><div class="mini-stat-value">${bmi.toFixed(1)}</div></div>
        ${profile.musclePct != null ? `<div class="mini-stat"><div class="mini-stat-label">Kas Oranı</div><div class="mini-stat-value">%${profile.musclePct}</div></div>` : ""}
        <div class="mini-stat"><div class="mini-stat-label">Bazal Metabolizma</div><div class="mini-stat-value">${targets.bmr} kcal</div></div>
      </div>
    </section>

    <section class="card">
      <div class="card-eyebrow">GÜNLÜK TAKİP</div>
      <div class="metrics-grid">
        ${metricCellHtml("water", "💧 Su", "ml", 3000, entry.water, 50)}
        ${metricCellHtml("sleep", "🌙 Uyku", "saat", 8, entry.sleep, 0.5)}
      </div>
    </section>

    <section class="card">
      <div class="card-head-row"><div class="card-eyebrow">SON 7 GÜN · KALORİ</div></div>
      <div class="week-grid">${weekHtml}</div>
    </section>

    <section class="card">
      <div class="card-eyebrow">KOÇUNA SOR</div>
      <div class="card-sub">Beslenme, antrenman, ilerleme — ne sorarsan sor.</div>
      <div class="chat-scroll" id="chatScroll">
        ${coachMessages.map(m => `<div class="chat-bubble ${m.role}">${esc(m.content)}</div>`).join("")}
        ${coachLoading ? `<div class="chat-bubble assistant">düşünüyor…</div>` : ""}
      </div>
      ${coachError ? `<div class="chat-error">Bir şeyler ters gitti (bu sayfa Claude dışında AI'a erişemiyor olabilir), tekrar dener misin?</div>` : ""}
      <div class="chat-input-row">
        <input type="text" class="chat-input" id="chatInput" placeholder="örn. bugün ne yesem?" />
        <button class="chat-send-btn" id="chatSend">➤</button>
      </div>
    </section>
  `;
}

function metricCellHtml(key, label, unit, target, value, step) {
  const pct = value ? Math.min(100, Math.round((value/target)*100)) : 0;
  return `
    <div class="metric-cell">
      <div class="metric-label-row">${label}</div>
      <input class="metric-input" type="number" inputmode="decimal" step="${step}" placeholder="—" value="${value ?? ""}" data-metric="${key}" />
      <div class="metric-target-row"><span>${unit}</span><span class="unit-mono">hedef ${target}</span></div>
      <div class="metric-track"><div class="metric-fill" style="width:${pct}%"></div></div>
    </div>`;
}

function attachHomeHandlers(entry, targets) {
  document.querySelectorAll("[data-metric]").forEach(el => {
    el.addEventListener("change", () => {
      const v = el.value === "" ? null : Number(el.value);
      updateEntry(activeDate, { [el.dataset.metric]: v });
      render();
    });
  });
  const scroll = document.getElementById("chatScroll");
  if (scroll) scroll.scrollTop = scroll.scrollHeight;

  const send = async () => {
    const input = document.getElementById("chatInput");
    const text = input.value.trim();
    if (!text || coachLoading) return;
    input.value = "";
    coachError = false;
    coachMessages = [...coachMessages, { role: "user", content: text }];
    coachLoading = true;
    render();
    try {
      const priorHistory = coachMessages.slice(0, -1).map(m => ({ role: m.role, content: m.content }));
      const reply = await askCoach(text, profile, targets, priorHistory, todayContext());
      coachMessages = [...coachMessages, { role: "assistant", content: reply }];
    } catch (e) {
      coachError = true;
    } finally {
      coachLoading = false;
      render();
    }
  };
  document.getElementById("chatSend").addEventListener("click", send);
  document.getElementById("chatInput").addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
}

        </div>` : ""}

      <div class="form-field" style="margin-top:14px;">
        <label class="form-label">Elle ekle (opsiyonel)</label>
        <div style="display:flex; gap:8px;">
          <div class="form-input-row" style="flex:1;"><input class="form-input" type="number" id="manualKcal" placeholder="kcal" /></div>
          <div class="form-input-row" style="flex:1;"><input class="form-input" type="number" id="manualProtein" placeholder="protein g" /></div>
          <button class="chat-send-btn" id="manualAdd" style="width:44px;">+</button>
        </div>
      </div>

      ${entry.meals && entry.meals.length ? `
        <div class="logged-meal-list">
          ${entry.meals.map(m => `
            <div class="logged-meal-row">
              <div style="flex:1;"><div class="logged-meal-text">${esc(m.text)}</div><div class="logged-meal-macro">${Math.round(m.kcal)} kcal · ${Math.round(m.protein)}g protein</div></div>
              <button class="logged-meal-remove" data-remove-meal="${m.id}">✕</button>
            </div>`).join("")}
        </div>` : ""}
    </section>

    <section class="card">
      <div class="card-eyebrow">ÖĞÜN PLANI ÖNERİSİ</div>
      <div class="meal-list">
        ${MEAL_PLAN.map(m => {
          const kcal = Math.round(targets.calorieTarget * m.ratio);
          const protein = Math.round(targets.proteinG * m.ratio);
          return `<div class="meal-row"><div class="meal-head-row"><span class="meal-name">${m.name}</span><span class="meal-macro">${kcal} kcal · ${protein}g protein</span></div><div class="meal-items">${m.items}</div></div>`;
        }).join("")}
      </div>
      <div class="meal-footnote">Örnek dağılım — referans amaçlı, gerçek yediklerini yukarıdan kaydet.</div>
    </section>
  `;
}

function addMeal(entry, newMeal) {
  const nextMeals = [...(entry.meals || []), newMeal];
  const t = sumMeals(nextMeals);
  updateEntry(activeDate, { meals: nextMeals, calories: t.kcal, protein: t.protein, carbs: t.carbs, fat: t.fat });
}

function attachNutritionHandlers(entry, targets) {
  document.querySelectorAll("[data-remove-meal]").forEach(btn => {
    btn.addEventListener("click", () => {
      const nextMeals = (entry.meals || []).filter(m => m.id !== btn.dataset.removeMeal);
      const t = sumMeals(nextMeals);
      updateEntry(activeDate, { meals: nextMeals, calories: t.kcal, protein: t.protein, carbs: t.carbs, fat: t.fat });
      render();
    });
  });

  document.getElementById("manualAdd").addEventListener("click", () => {
    const kcal = Number(document.getElementById("manualKcal").value) || 0;
    const protein = Number(document.getElementById("manualProtein").value) || 0;
    if (!kcal && !protein) return;
    addMeal(entry, { id: `${Date.now()}`, text: "Elle eklendi", kcal, protein, carbs: 0, fat: 0 });
    lastMealResult = null;
    render();
  });

  const submitMeal = async () => {
    const input = document.getElementById("mealInput");
    const description = input.value.trim();
    if (!description || mealLoading) return;
    mealLoading = true; mealError = false; lastMealResult = null;
    render();
    try {
      const priorTotals = sumMeals(entry.meals);
      const result = await analyzeMealAndAdvise(description, profile, targets, todayContext(), priorTotals);
      addMeal(entry, { id: `${Date.now()}`, text: description, kcal: result.kcal, protein: result.protein, carbs: result.carbs, fat: result.fat });
      lastMealResult = { ...result, description };
    } catch (e) {
      mealError = true;
    } finally {
      mealLoading = false;
      render();
    }
  };
  document.getElementById("mealSend").addEventListener("click", submitMeal);
  document.getElementById("mealInput").addEventListener("keydown", (e) => { if (e.key === "Enter") submitMeal(); });
}

// ---------------------------------------------------------------------------
// Training tab
// ---------------------------------------------------------------------------
function renderTraining(entry) {
  const dayInfo = DAY_TYPES[entry.dayType];
  const totalEx = dayInfo.exercises.length;
  const doneEx = dayInfo.exercises.filter(e => entry.doneExercises[e.id]).length;

  let exListHtml = "";
  if (totalEx === 0) {
    exListHtml = `<div class="rest-note">Bugün dinlenme günü. İstersen hafif yürüyüş / kardiyo ekleyebilirsin.</div>`;
  } else {
    exListHtml = `<div class="ex-list">` + dayInfo.exercises.map(ex => {
      const done = !!entry.doneExercises[ex.id];
      return `
        <div class="ex-row ${done?'done':''}">
          <button class="checkbox-btn" data-toggle="${ex.id}"><span class="checkbox ${done?'done':''}">${done?'✓':''}</span></button>
          <button class="ex-name-btn" data-toggle="${ex.id}"><span class="ex-name ${done?'done':''}">${esc(ex.name)}</span></button>
          <span class="ex-scheme">${ex.scheme}</span>
          <button class="info-btn" data-info="${ex.id}" data-name="${esc(ex.name)}" data-scheme="${ex.scheme}">i</button>
        </div>`;
    }).join("") + `</div>`;
  }

  return `
    <section class="card">
      <div class="card-head-row">
        <div><div class="card-eyebrow">${String(totalEx).padStart(2,"0")} HAREKET</div><div class="card-title">${dayInfo.label}</div><div class="card-sub">${dayInfo.sub}</div></div>
      </div>
      ${totalEx > 0 ? `<div class="progress-track"><div class="progress-fill" style="width:${(doneEx/totalEx)*100}%"></div></div>` : ""}
      ${exListHtml}
    </section>
  `;
}

function attachTrainingHandlers(entry) {
  document.querySelectorAll("[data-toggle]").forEach(el => {
    el.addEventListener("click", () => {
      const doneExercises = { ...entry.doneExercises, [el.dataset.toggle]: !entry.doneExercises[el.dataset.toggle] };
      updateEntry(activeDate, { doneExercises });
      render();
    });
  });
  document.querySelectorAll("[data-info]").forEach(el => {
    el.addEventListener("click", () => openModal(el.dataset.info, el.dataset.name, el.dataset.scheme));
  });
}

function openModal(exId, name, scheme) {
  const media = MEDIA[exId];
  document.getElementById("modalCard").innerHTML = `
    <div class="modal-head">
      <div><div class="card-eyebrow">HAREKET</div><div class="modal-title">${esc(name)}</div></div>
      <button class="modal-close" id="modalCloseBtn">✕</button>
    </div>
    <div class="modal-img-row">
      <img class="modal-img" src="${exImg(exId,0)}" alt="${esc(name)}" onerror="this.style.display='none'" />
      <img class="modal-img" src="${exImg(exId,1)}" alt="${esc(name)}" onerror="this.style.display='none'" />
    </div>
    <div class="modal-tip">${esc(media ? media.tip : "")}</div>
    <div class="modal-scheme">${scheme}</div>
  `;
  document.getElementById("modalBackdrop").classList.add("open");
  document.getElementById("modalCloseBtn").addEventListener("click", closeModal);
}
function closeModal() { document.getElementById("modalBackdrop").classList.remove("open"); }
document.getElementById("modalBackdrop").addEventListener("click", (e) => { if (e.target.id === "modalBackdrop") closeModal(); });

// ---------------------------------------------------------------------------
// Onboarding
// ---------------------------------------------------------------------------
let obState = null;
function renderOnboarding() {
  const initial = profile;
  if (!obState) {
    obState = {
      gender: initial?.gender || "erkek",
      age: initial?.age ?? "",
      heightCm: initial?.heightCm ?? "",
      weightKg: initial?.weightKg ?? "",
      bodyFatPct: initial?.bodyFatPct ?? "",
      musclePct: initial?.musclePct ?? "",
      activity: initial?.activity || "orta",
      goal: initial?.goal || "kas",
      trainingDays: initial?.trainingDays || DEFAULT_TRAINING_DAYS,
    };
  }
  const sortedDays = obState.trainingDays.slice().sort((a,b)=>a-b);
  const splitPreview = sortedDays.map((idx,i) => {
    const w = WEEKDAYS.find(w => w.idx === idx);
    const split = DAY_TYPES[SPLIT_ORDER[i % SPLIT_ORDER.length]];
    return `${w.short}: ${split.label}`;
  });

  return `
    <div class="onboarding-wrap"><div class="onboarding-card">
      <div class="eyebrow">${initial ? "PROFİLİ DÜZENLE" : "TANIŞALIM"}</div>
      <h1 style="margin-bottom:4px;">${initial ? "Bilgilerini güncelle" : "Sana özel program için birkaç bilgi"}</h1>
      <p class="onboarding-sub">Bu veriler sadece bu cihazda/tarayıcıda saklanır.</p>

      <div class="gender-row">
        <button class="gender-btn ${obState.gender==='erkek'?'active':''}" data-gender="erkek">Erkek</button>
        <button class="gender-btn ${obState.gender==='kadin'?'active':''}" data-gender="kadin">Kadın</button>
      </div>

      ${formFieldHtml("age","Yaş","yaş","23")}
      ${formFieldHtml("heightCm","Boy","cm","182")}
      ${formFieldHtml("weightKg","Kilo","kg","91.8")}
      ${formFieldHtml("bodyFatPct","Yağ oranı","%","27")}
      ${formFieldHtml("musclePct","Kas oranı (opsiyonel)","%","37.6")}

      <div class="form-label">Aktivite seviyesi</div>
      <div class="option-col">
        ${Object.entries(ACTIVITY_LEVELS).map(([k,v]) => `<button class="option-row ${obState.activity===k?'active':''}" data-activity="${k}"><span class="option-row-label">${v.label}</span><span class="option-row-sub">${v.sub}</span></button>`).join("")}
      </div>

      <div class="form-label" style="margin-top:14px;">Hedef</div>
      <div class="option-col">
        ${Object.entries(GOALS).map(([k,v]) => `<button class="option-row ${obState.goal===k?'active':''}" data-goal="${k}"><span class="option-row-label">${v.label}</span></button>`).join("")}
      </div>

      <div class="form-label" style="margin-top:14px;">Hangi günler antrenman yapacaksın?</div>
      <div class="day-grid">
        ${WEEKDAYS.map(w => `<button class="day-btn ${obState.trainingDays.includes(w.idx)?'active':''}" data-day="${w.idx}">${w.short}</button>`).join("")}
      </div>
      <div class="day-preview">${splitPreview.length ? splitPreview.join(" · ") : "En az 1 gün seç — seçmezsen varsayılan Pzt/Sal/Prş/Cum kullanılır."}</div>

      <div class="onboarding-actions">
        ${initial ? `<button class="onboarding-cancel-btn" id="obCancel">vazgeç</button>` : ""}
        <button class="onboarding-save-btn" id="obSave" ${canSaveOb() ? "" : "disabled"}>Kaydet</button>
      </div>
    </div></div>
  `;
}
function formFieldHtml(key, label, unit, placeholder) {
  return `
    <div class="form-field">
      <label class="form-label">${label}</label>
      <div class="form-input-row">
        <input class="form-input" type="number" inputmode="decimal" step="0.1" data-field="${key}" value="${obState[key]}" placeholder="${placeholder}" />
        <span class="form-unit">${unit}</span>
      </div>
    </div>`;
}
function canSaveOb() { return obState.gender && obState.age && obState.heightCm && obState.weightKg && obState.bodyFatPct; }

function attachOnboardingHandlers() {
  document.querySelectorAll("[data-gender]").forEach(b => b.addEventListener("click", () => { obState.gender = b.dataset.gender; render(); }));
  document.querySelectorAll("[data-field]").forEach(inp => inp.addEventListener("input", () => { obState[inp.dataset.field] = inp.value; }));
  document.querySelectorAll("[data-activity]").forEach(b => b.addEventListener("click", () => { obState.activity = b.dataset.activity; render(); }));
  document.querySelectorAll("[data-goal]").forEach(b => b.addEventListener("click", () => { obState.goal = b.dataset.goal; render(); }));
  document.querySelectorAll("[data-day]").forEach(b => b.addEventListener("click", () => {
    const idx = Number(b.dataset.day);
    obState.trainingDays = obState.trainingDays.includes(idx) ? obState.trainingDays.filter(d=>d!==idx) : [...obState.trainingDays, idx].sort((a,b)=>a-b);
    render();
  }));
  const cancelBtn = document.getElementById("obCancel");
  if (cancelBtn) cancelBtn.addEventListener("click", () => { editingProfile = false; obState = null; render(); });
  const saveBtn = document.getElementById("obSave");
  if (saveBtn) saveBtn.addEventListener("click", () => {
    if (!canSaveOb()) return;
    profile = {
      gender: obState.gender, activity: obState.activity, goal: obState.goal,
      trainingDays: obState.trainingDays.slice().sort((a,b)=>a-b),
      age: Number(obState.age), heightCm: Number(obState.heightCm), weightKg: Number(obState.weightKg),
      bodyFatPct: Number(obState.bodyFatPct), musclePct: obState.musclePct === "" ? null : Number(obState.musclePct),
    };
    persistProfile();
    editingProfile = false;
    obState = null;
    render();
  });
}

render();
</script>
